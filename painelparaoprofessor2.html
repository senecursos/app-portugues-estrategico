<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Atividades Extras</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">

        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "atividadeextra.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyC9cRrlARDHnxuABa_zewIbZVEHLTRhJgs",
            authDomain: "atividade-extra-36f40.firebaseapp.com",
            databaseURL: "https://atividade-extra-36f40-default-rtdb.firebaseio.com",
            projectId: "atividade-extra-36f40",
            storageBucket: "atividade-extra-36f40.firebasestorage.app",
            messagingSenderId: "1023269799106",
            appId: "1:1023269799106:web:32bf9685c05d65b90c675b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // BANCO DE QUESTÕES COM DESTAQUES EM SUBLINHADO (<u>)
        const questoes = [
            {
                id: 1,
                pergunta: "Assinale a alternativa em que a concordância nominal está estritamente correta de acordo com a norma-padrão.",
                tipo: "A-E",

                    "E) Havia <u>bastantes</u> motivos para o adiamento da sessão plenária."
                ],
                gabarito: "D) A chefia considerou <u>desnecessárias</u> as exigências burocráticas e os prazos longos."
            },
            {
                id: 2,
                pergunta: "Assinale a alternativa em que a concordância nominal preenche adequadamente e gramaticalmente a lacuna da frase: \"É ____ entrada de menores desacompanhados no recinto da assembleia.\"",
                tipo: "A-E",
                opcoes: [
                    "A) proibido",
                    "B) proibida",
                    "C) proibidos",
                    "D) proibidas",
                    "E) proibido a"
                ],
                gabarito: "B) proibida"
            },
            {
                id: 3,
                pergunta: "Assinale a alternativa correta quanto à concordância nominal.",
                tipo: "A-E",
                opcoes: [
                    "A) Os pareceres jurídicos e técnicos foram <u>aprovados</u> por unanimidade pelo conselho.",
                    "B) A empresa apresentou proposta e balanço <u>atualizado</u> no mesmo dia.",
                    "C) Tratava-se de leis e decretos <u>revogadas</u> pela nova gestão municipal.",
                    "D) Os candidatos demonstraram <u>menos</u> preocupação com o resultado do certame.",
                    "E) Ficaram <u>mudos</u> a testemunha e o réu durante toda a instrução processual."
                ],
                gabarito: "A) Os pareceres jurídicos e técnicos foram <u>aprovados</u> por unanimidade pelo conselho."
            },
            {
                id: 4,
                pergunta: "Assinale a alternativa em que a concordância verbal está correta segundo a norma-padrão.",
                tipo: "A-E",
                opcoes: [
                    "A) Mais de um auditor participou da reunião extraordinária de ontem à tarde.",
                    "B) Cerca de trinta servidores faltaram ao expediente de segunda-feira.",
                    "C) A maioria dos candidatos <u>foram aprovados</u> na primeira etapa do concurso.",
                    "D) 25% dos eleitores <u>votou</u> no candidato da oposição no último pleito.",
                    "E) Fui eu que <u>resolveu</u> o impasse administrativo na controladoria."
                ],
                gabarito: "B) Cerca de trinta servidores faltaram ao expediente de segunda-feira."
            },
            {
                id: 5,
                pergunta: "Assinale a alternativa em que a concordância verbal obedece rigorosamente à norma-padrão.",
                tipo: "A-E",
                opcoes: [
                    "A) <u>Houveram</u> muitos protestos na porta da assembleia legislativa durante a votação.",
                    "B) <u>Fazem</u> dois anos que o regimento interno não é reformulado pelo plenário.",
                    "C) Deve <u>existir</u> soluções viáveis para o problema orçamentário da autarquia.",

                ],

            },
            {
                id: 6,
                pergunta: "Assinale a alternativa gramaticalmente correta quanto à concordância verbal.",
                tipo: "A-E",
                opcoes: [

                    "B) Nem um nem outro servidor <u>faltou</u> ao serviço na semana passada.",

                    "D) Satisfez a todos os presentes as explicações do relator do processo.",

            },
            {
                id: 7,

                tipo: "A-E",

                    "A) parabéns, caatinga, guaraná",

            {

                tipo: "A-E",
                opcoes: [
                    "A) herói, chapéu, anzol",
                    "B) papéis, troféus, herói",
                    "C) constrói, ideia, apóio",
                    "D) chapéu, herói, gratuito",

                ],
                gabarito: "B) papéis, troféus, herói"
            },
            {
                id: 9,
                pergunta: "Assinale a alternativa em que todas as palavras são acentuadas devido à regra do hiato (vogais \"i\" ou \"u\" tônicas sozinhas ou seguidas de \"s\" na sílaba).",
                tipo: "A-E",
                opcoes: [
                    "A) saíra, baú, juiz",
                    "B) saúde, caída, faísca",
                    "C) parabéns, piauí, egoísmo",
                    "D) baú, ruína, papéis",
                    "E) graúdo, influir, gratuito"
                ],
                gabarito: "B) saúde, caída, faísca"
            },
            {
                id: 10,
                pergunta: "Assinale a alternativa cujos vocábulos tiveram seus acentos gráficos eliminados em decorrência do Acordo Ortográfico da Língua Portuguesa (ditongos abertos em palavras paroxítonas).",
                tipo: "A-E",
                opcoes: [
                    "A) assembleia, ideia, jiboia",
                    "B) heroico, paranoia, assembleia",
                    "C) ideia, colmeia, voo",
                    "D) feiura, juiz, gratuito",
                    "E) geleia, joia, Piauí"
                ],
                gabarito: "A) assembleia, ideia, jiboia"
            },
            {
                id: 11,
                pergunta: "Assinale a alternativa em que a colocação do pronome oblíquo átono obedece rigorosamente à norma-padrão.",
                tipo: "A-E",
                opcoes: [
                    "A) Não <u>informaram-me</u> sobre as alterações no edital da licitação.",
                    "B) Jamais <u>revelar-lhe-ei</u> os segredos da auditoria interna.",
                    "C) Os candidatos que <u>apresentaram-se</u> atrasados foram desclassificados.",
                    "D) Quando <u>realizou-se</u> a sessão plenária, o quórum era insuficiente.",
                    "E) Ninguém <u>o</u> advertiu sobre os riscos da operação financeira."
                ],
                gabarito: "E) Ninguém <u>o</u> advertiu sobre os riscos da operação financeira."
            },
            {
                id: 12,
                pergunta: "Assinale a alternativa em que a colocação pronominal viola a norma-padrão por iniciar a oração com pronome oblíquo átono.",
                tipo: "A-E",
                opcoes: [
                    "A) Me disseram que a reunião foi adiada pela mesa diretora.",
                    "B) Disse-lhe toda a verdade durante a audiência pública.",
                    "C) Entregaremos-lhe o relatório técnico amanhã sem falta.",
                    "D) Fazem-se necessários novos estudos orçamentários.",
                    "E) Obedecer-lhe-emos prontamente em todas as diretrizes."
                ],
                gabarito: "A) Me disseram que a reunião foi adiada pela mesa diretora."
            },
            {
                id: 13,
                pergunta: "Assinale a alternativa em que o emprego da mesóclise está correto e obrigatório segundo a norma-padrão.",
                tipo: "A-E",
                opcoes: [
                    "A) Informar-<u>te-ei</u> sobre todas as mudanças no cronograma da auditoria.",
                    "B) Não <u>revelar-lhe-ei</u> os dados sigilosos da investigação.",
                    "C) Se <u>ajudar-te-ia</u> com prazer na elaboração do parecer.",
                    "D) Quando <u>comunicar-lhe-ão</u> a decisão da junta médica?",
                    "E) O supervisor <u>entregar-me-á</u> o documento amanhã cedo."
                ],
                gabarito: "A) Informar-<u>te-ei</u> sobre todas as mudanças no cronograma da auditoria."
            },
            {
                id: 14,
                pergunta: "Assinale a alternativa em que a vírgula foi empregada de forma incorreta, violando a estrutura sintática básica da oração.",
                tipo: "A-E",
                opcoes: [
                    "A) Os auditores da controladoria geral examinaram os documentos contábeis.",
                    "B) Durante a sessão de ontem, os parlamentares aprovaram o projeto de lei.",
                    "C) A comissão técnica, analisou minuciosamente todas as propostas da licitação.",
                    "D) Os servidores públicos, exaustos pela carga horária, solicitaram o recesso.",
                    "E) Conforme determinam as normas vigentes, o processo foi arquivado."
                ],
                gabarito: "C) A comissão técnica, analisou minuciosamente todas as propostas da licitação."
            },
            {
                id: 15,
                pergunta: "Assinale a alternativa em que as vírgulas foram empregadas para isolar um vocativo.",
                tipo: "A-E",
                opcoes: [
                    "A) Senhor Presidente, solicitamos a palavra para esclarecimentos.",
                    "B) Brasília, capital do país, sediará o congresso internacional.",
                    "C) Os auditores, que chegaram cedo, iniciaram a análise dos balanços.",
                    "D) Embora o prazo estivesse encerrado, o recurso foi aceito.",
                    "E) A decisão foi tomada, mas houve muita divergência no plenário."
                ],
                gabarito: "A) Senhor Presidente, solicitamos a palavra para esclarecimentos."
            },
            {
                id: 16,
                pergunta: "Assinale a alternativa em que a vírgula antes da conjunção \"e\" é obrigatória devido à diferença de sujeitos entre as orações coordenadas.",
                tipo: "A-E",
                opcoes: [
                    "A) O fiscal examinou os documentos e liberou o pagamento do contrato.",
                    "B) Os servidores concluíram o relatório, e a diretoria aprovou o texto final.",
                    "C) A equipe trabalhou arduamente e alcançou todas as metas estabelecidas.",
                    "D) O relator emitiu o parecer e abandonou a sala de reuniões.",
                    "E) Os candidatos estudaram muito e obtiveram excelentes notas."
                ],
                gabarito: "B) Os servidores concluíram o relatório, e a diretoria aprovou o texto final."
            },
            {
                id: 17,
                pergunta: "Assinale a alternativa em que as vírgulas isolam corretamente uma oração subordinada adjetiva explicativa.",
                tipo: "A-E",
                opcoes: [
                    "A) Os candidatos que obtiveram nota superior a 80% foram convocados.",
                    "B) Os candidatos, que obtiveram nota superior a 80%, foram convocados.",
                    "C) A lei que foi aprovada ontem trará grandes impactos econômicos.",
                    "D) O relatório que o consultor apresentou sanou todas as dúvidas.",
                    "E) A decisão que tomamos fundamentou-se nos pareceres jurídicos."
                ],
                gabarito: "B) Os candidatos, que obtiveram nota superior a 80%, foram convocados."
            },
            {
                id: 18,
                pergunta: "Assinale a alternativa em que a vírgula após o adjunto adverbial deslocado é obrigatória devido à extensão da locução (três ou mais palavras).",
                tipo: "A-E",
                opcoes: [
                    "A) Ontem, os diretores assinaram o contrato administrativo.",
                    "B) No prédio da prefeitura, ocorreu a reunião com os secretários.",
                    "C) No decorrer da última sessão plenária realizada na semana passada, os vereadores aprovaram a medida.",
                    "D) Aqui, realizam-se importantes auditorias financeiras.",
                    "E) Frequentemente, a comissão revisa os termos do edital."
                ],
                gabarito: "C) No decorrer da última sessão plenária realizada na semana passada, os vereadores aprovaram a medida."
            },
            {
                id: 19,
                pergunta: "Assinale a alternativa que apresenta a correta reescrita da frase \"O comitê aprovou todas as diretrizes orçamentárias\" na voz passiva analítica.",
                tipo: "A-E",
                opcoes: [
                    "A) Todas as diretrizes orçamentárias foram aprovadas pelo comitê.",
                    "B) Aprovou-se todas as diretrizes orçamentárias pelo comitê.",
                    "C) O comitê havia aprovado as diretrizes orçamentárias.",
                    "D) Todas as diretrizes orçamentárias foram aprovadas com o comitê.",
                    "E) Foram aprovadas o comitê e as diretrizes orçamentárias."
                ],
                gabarito: "A) Todas as diretrizes orçamentárias foram aprovadas pelo comitê."
            },
            {
                id: 20,
                pergunta: "Assinale a alternativa em que a reescrita da frase \"Caso haja recursos financeiros, o projeto será executado\" mantém o sentido original de condição e a correção gramatical.",
                tipo: "A-E",
                opcoes: [
                    "A) Havendo recursos financeiros, o projeto será executado.",
                    "B) Houveram recursos financeiros, o projeto será executado.",
                    "C) Porque há recursos financeiros, o projeto será executado.",
                    "D) Embora haja recursos financeiros, o projeto será executado.",
                    "E) Quando houveram recursos financeiros, o projeto foi executado."
                ],
                gabarito: "A) Havendo recursos financeiros, o projeto será executado."
            },
            {
                id: 21,
                pergunta: "Assinale a alternativa em que a substituição dos complementos verbais por pronomes oblíquos na frase \"O supervisor entregue o relatório aos diretores\" foi feita em conformidade com a norma-padrão.",
                tipo: "A-E",
                opcoes: [
                    "A) O supervisor o entregou aos diretores.",
                    "B) O supervisor entregou-o aos diretores.",
                    "C) O supervisor lhes entregou o relatório.",
                    "D) O supervisor entregou-lhes o relatório.",
                    "E) O supervisor o-lhes entregou."
                ],
                gabarito: "B) O supervisor entregou-o aos diretores."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";

                let opcoesHTML = "";
                q.opcoes.forEach(op => {
                    const ehGabarito = normalizarTexto(op) === normalizarTexto(q.gabarito);
                    const prefixo = ehGabarito ? '🟢 ' : '';
                    opcoesHTML += `
                        <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                            ${prefixo}${op}
                        </div>
                        <div class="barra-progresso-bg">
                            <div class="barra-progresso-fill" style="width: 0%; background-color: ${ehGabarito ? '#16a34a' : '#2563eb'};"></div>
                            <div class="barra-texto">0% (0 votos)</div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}">${opcoesHTML}</div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para os alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        
                        let corBarra = ehGabarito ? "#16a34a" : "#2563eb";
                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
