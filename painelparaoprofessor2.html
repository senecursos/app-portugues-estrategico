<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Atividades Extras</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "atividadeextra.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyC9cRrlARDHnxuABa_zewIbZVEHLTRhJgs",
            authDomain: "atividade-extra-36f40.firebaseapp.com",
            databaseURL: "https://atividade-extra-36f40-default-rtdb.firebaseio.com",
            projectId: "atividade-extra-36f40",
            storageBucket: "atividade-extra-36f40.firebasestorage.app",
            messagingSenderId: "1023269799106",
            appId: "1:1023269799106:web:32bf9685c05d65b90c675b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // BANCO DE QUESTÕES (MORFOLOGIA) - COM DESTAQUE DUPLO NEGRITO + SUBLINHADO
        const questoes = [
            {
                id: 1,
                pergunta: "Na frase \"O parecer do relator foi considerado <b><u>inconsistente</u></b> pela comissão avaliadora\", a palavra em destaque classifica-se morfologicamente como:",
                tipo: "A-E",
                opcoes: [
                    "A) Substantivo.",
                    "B) Adjetivo.",
                    "C) Advérbio.",
                    "D) Particípio.",
                    "E) Pronome."
                ],
                gabarito: "B) Adjetivo."
            },
            {
                id: 2,
                pergunta: "Assinale a alternativa em que TODAS as palavras destacadas pertencem à classe dos substantivos:",
                tipo: "A-E",
                opcoes: [
                    "A) O <b><u>olhar</u></b> da testemunha revelava <b><u>profunda</u></b> tristeza.",
                    "B) O gestor <b><u>público</u></b> agiu de modo <b><u>transparente</u></b>.",
                    "C) A <b><u>decisão</u></b> do conselho evitou o <b><u>colapso</u></b> financeiro.",
                    "D) O <b><u>amanhã</u></b> sempre traz <b><u>novas</u></b> oportunidades.",
                    "E) Aquela <b><u>jovem</u></b> estudava <b><u>bastante</u></b> para os exames."
                ],
                gabarito: "C) A <b><u>decisão</u></b> do conselho evitou o <b><u>colapso</u></b> financeiro."
            },
            {
                id: 3,
                pergunta: "Na frase \"A comissão convocou os candidatos e informou-<b><u>lhes</u></b> o novo cronograma do certame\", a palavra destacada pertence à classe dos:",
                tipo: "A-E",
                opcoes: [
                    "A) Artigos.",
                    "B) Advérbios.",
                    "C) Preposições.",
                    "D) Pronomes.",
                    "E) Conjunções."
                ],
                gabarito: "D) Pronomes."
            },
            {
                id: 4,
                pergunta: "Identifique a alternativa em que a palavra destacada atua morfologicamente como um verbo no contexto em que se insere:",
                tipo: "A-E",
                opcoes: [
                    "A) O <b><u>corte</u></b> de despesas foi aprovado em sessão extraordinária.",
                    "B) O <b><u>trabalho</u></b> em equipe enobrece os resultados do setor.",
                    "C) A <b><u>fala</u></b> do diretor comoveu todos os presentes no auditório.",
                    "D) Aquele <b><u>imposto</u></b> sobre mercadorias foi considerado abusivo.",
                    "E) É fundamental que a testemunha <b><u>fale</u></b> a verdade no depoimento."
                ],
                gabarito: "E) É fundamental que a testemunha <b><u>fale</u></b> a verdade no depoimento."
            },
            {
                id: 5,
                pergunta: "No trecho \"<b><u>Uns</u></b> questionamentos válidos surgiram após <b><u>o</u></b> encerramento do debate\", os termos destacados classificam-se, respectivamente, como:",
                tipo: "A-E",
                opcoes: [
                    "A) Pronome indefinido e preposição.",
                    "B) Artigo indefinido e artigo definido.",
                    "C) Numeral e pronome oblíquo.",
                    "D) Adjetivo e artigo definido.",
                    "E) Substantivo e verbo."
                ],
                gabarito: "B) Artigo indefinido e artigo definido."
            },
            {
                id: 6,
                pergunta: "Em \"O relator, após analisar detalhadamente o extenso documento, considerou a medida <b><u>precipitada</u></b>\", a palavra destacada é um adjetivo. A qual substantivo esse adjetivo está se referindo sintaticamente?",
                tipo: "A-E",
                opcoes: [
                    "A) Relator.",
                    "B) Documento.",
                    "C) Analisar.",
                    "D) Medida.",
                    "E) Extenso."
                ],
                gabarito: "D) Medida."
            },
            {
                id: 7,
                pergunta: "Assinale a opção em que a palavra \"A\" funciona exclusivamente como um artigo definido:",
                tipo: "A-E",
                opcoes: [
                    "A) O fiscal entregou a notificação de autuação <b><u>a</u></b> ele.",
                    "B) Daqui <b><u>a</u></b> pouco iniciaremos o julgamento dos recursos.",
                    "C) A candidata aprovada foi <b><u>a</u></b> que apresentou a melhor titulação.",
                    "D) Encaminhamos <b><u>a</u></b> documentação exigida pela auditoria interna.",
                    "E) Nunca mais <b><u>a</u></b> vi desde a última reunião de planejamento."
                ],
                gabarito: "D) Encaminhamos <b><u>a</u></b> documentação exigida pela auditoria interna."
            },
            {
                id: 8,
                pergunta: "Na oração \"Apesar das críticas severas, a gestão manteve <b><u>suas</u></b> diretrizes intactas\", a palavra destacada classifica-se como:",
                tipo: "A-E",
                opcoes: [
                    "A) Pronome possessivo.",
                    "B) Artigo definido.",
                    "C) Adjetivo restritivo.",
                    "D) Substantivo abstrato.",
                    "E) Pronome demonstrativo."
                ],
                gabarito: "A) Pronome possessivo."
            },
            {
                id: 9,
                pergunta: "Observe os termos destacados no trecho: \"O gestor <b><u>cauteloso</u></b> <b><u>recuou</u></b> diante da forte instabilidade do mercado.\" A ordem correta da classificação morfológica das duas palavras destacadas é:",
                tipo: "A-E",
                opcoes: [
                    "A) Substantivo e Advérbio.",
                    "B) Adjetivo e Verbo.",
                    "C) Advérbio e Verbo.",
                    "D) Adjetivo e Substantivo.",
                    "E) Pronome e Verbo."
                ],
                gabarito: "B) Adjetivo e Verbo."
            },
            {
                id: 10,
                pergunta: "Assinale a alternativa cujas palavras pertencem TODAS à classe dos verbos:",
                tipo: "A-E",
                opcoes: [
                    "A) Parecer, ofício, trâmite.",
                    "B) Contratante, fiador, devedor.",
                    "C) Visto, anexo, quite.",
                    "D) Intervir, propor, reaver.",
                    "E) Canto, fala, choro."
                ],
                gabarito: "D) Intervir, propor, reaver."
            },
            {
                id: 11,
                pergunta: "Em \"<b><u>Aqueles</u></b> que não entregarem o <b><u>seu</u></b> relatório no prazo serão devidamente notificados\", as palavras destacadas pertencem à classe dos:",
                tipo: "A-E",
                opcoes: [
                    "A) Substantivos.",
                    "B) Adjetivos.",
                    "C) Pronomes.",
                    "D) Artigos.",
                    "E) Verbos."
                ],
                gabarito: "C) Pronomes."
            },
            {
                id: 12,
                pergunta: "Em \"O laudo técnico parecia <b><u>inconsistente</u></b> após a primeira revisão\", se alterarmos o sujeito da frase para o plural (\"Os laudos técnicos...\"), a palavra destacada deverá:",
                tipo: "A-E",
                opcoes: [
                    "A) Permanecer obrigatoriamente invariável (\"inconsistente\").",
                    "B) Mudar para a forma adverbial (\"inconsistentemente\").",
                    "C) Flexionar-se no plural, assumindo a forma \"inconsistentes\".",
                    "D) Assumir o gênero feminino plural (\"inconsistentes\") independentemente do substantivo.",
                    "E) Transformar-se em um substantivo abstrato plural."
                ],
                gabarito: "C) Flexionar-se no plural, assumindo a forma \"inconsistentes\"."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";

                let opcoesHTML = "";
                q.opcoes.forEach(op => {
                    const ehGabarito = normalizarTexto(op) === normalizarTexto(q.gabarito);
                    const prefixo = ehGabarito ? '🟢 ' : '';
                    opcoesHTML += `
                        <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                            ${prefixo}${op}
                        </div>
                        <div class="barra-progresso-bg">
                            <div class="barra-progresso-fill" style="width: 0%; background-color: ${ehGabarito ? '#16a34a' : '#2563eb'};"></div>
                            <div class="barra-texto">0% (0 votos)</div>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}">${opcoesHTML}</div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para os alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        
                        let corBarra = ehGabarito ? "#16a34a" : "#2563eb";
                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
