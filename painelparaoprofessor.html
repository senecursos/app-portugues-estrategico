<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (15 QUESTÕES)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'Na oração "Apurou-se rigorosamente a denúncia de fraude no processo licitatório", a partícula "se" exerce a mesma função sintática que na seguinte oração:',
                tipo: "A-E",
                opcoes: ["A) O corregedor arrependeu-se da decisão precipitada.", "B) Precisa-se de novos investigadores para o departamento de inteligência.", "C) Consertam-se viaturas danificadas na garagem central.", "D) O suspeito feriu-se durante a perseguição policial.", "E) Os parlamentares ofenderam-se durante a sessão plenária.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Consertam-se viaturas danificadas na garagem central."
            },
            {
                id: 2,
                pergunta: 'Assinale a alternativa que apresenta a oração escrita de acordo com a norma-padrão de concordância verbal.',
                tipo: "A-E",
                opcoes: ["A) Fazem dez anos que o último edital da polícia civil foi publicado.", "B) Havia muitos candidatos preparados aguardando a convocação final.", "C) Deve existir falhas graves no inquérito remetido ao Ministério Público.", "D) Tratam-se de questões extremamente complexas sobre direito penal.", "E) Faltou, durante a operação de busca e apreensão, mandados específicos.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Havia muitos candidatos preparados aguardando a convocação final."
            },
            {
                id: 3,
                pergunta: 'O verbo "implicar" possui regências distintas a depender do seu significado. Assinale a alternativa em que a regência aplicada está estritamente correta segundo a norma culta, no sentido de acarretar/produzir como consequência.',
                tipo: "A-E",
                opcoes: ["A) A ausência de provas materiais implicará na absolvição sumária do réu.", "B) O corte no orçamento da segurança implicou em redução do policiamento.", "C) A desobediência civil implica graves sanções legais aos envolvidos.", "D) O novo decreto implicará sobre as regras de aposentadoria dos policiais.", "E) A falta de treinamento implicou aos recrutas um péssimo desempenho.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) A desobediência civil implica graves sanções legais aos envolvidos."
            },
            {
                id: 4,
                pergunta: 'No trecho "Os peritos criminais, na manhã de ontem, entregaram o laudo cadavérico ao delegado", o uso das vírgulas justifica-se pela mesma regra aplicada em:',
                tipo: "A-E",
                opcoes: ["A) O governador, o prefeito e os secretários assinaram o acordo de segurança.", "B) A arma do crime, um revólver calibre 38, foi localizada no terreno baldio.", "C) Concluída a investigação, o inquérito foi rapidamente remetido à justiça.", "D) O relatório final da corporação, por questões éticas, foi mantido em sigilo.", "E) O Ministério Público, instituição fundamental ao Estado, pediu a prisão.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) O relatório final da corporação, por questões éticas, foi mantido em sigilo."
            },
            {
                id: 5,
                pergunta: 'A ocorrência do acento indicativo de crase é rigorosamente proibida em qual das orações abaixo?',
                tipo: "A-E",
                opcoes: ["A) O promotor referiu-se à mesma testemunha ouvida ontem.", "B) O governo estadual concedeu reajuste salarial àquela categoria.", "C) O suspeito permaneceu calado frente a frente com o investigador.", "D) As equipes retornaram à base logo após a deflagração da operação.", "E) A decisão do tribunal foi favorável às medidas cautelares propostas.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) O suspeito permaneceu calado frente a frente com o investigador."
            },
            {
                id: 6,
                pergunta: 'Na frase "Conquanto o orçamento estivesse reduzido, o departamento adquiriu novos armamentos", a conjunção "Conquanto" pode ser substituída, sem prejuízo do sentido original e da correção gramatical, por:',
                tipo: "A-E",
                opcoes: ["A) Porquanto.", "B) Contudo.", "C) Portanto.", "D) Embora.", "E) Desde que.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Embora."
            },
            {
                id: 7,
                pergunta: 'Assinale a alternativa em que a colocação do pronome oblíquo átono obedece rigorosamente à norma-padrão.',
                tipo: "A-E",
                opcoes: ["A) Lhe informarei todos os detalhes da investigação amanhã cedo.", "B) Os documentos que encontram-se na gaveta são sigilosos.", "C) Nunca se exigiu tanta dedicação dos novos servidores públicos.", "D) O escrivão tinha ausentado-se do cartório durante o expediente.", "E) Me disseram que a prova do concurso será extremamente difícil.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Nunca se exigiu tanta dedicação dos novos servidores públicos."
            },
            {
                id: 8,
                pergunta: 'Na oração "A comissão investigadora tem absoluta certeza de que a fraude ocorreu em 2024", o termo "que" atua morfologicamente como:',
                tipo: "A-E",
                opcoes: ["A) Pronome relativo.", "B) Conjunção subordinativa integrante.", "C) Conjunção subordinativa adverbial causal.", "D) Pronome interrogativo.", "E) Partícula de realce.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Conjunção subordinativa integrante."
            },
            {
                id: 9,
                pergunta: 'Assinale a alternativa que apresenta a correta transposição da oração "O governo estadual suspenderá as férias dos policiais" para a voz passiva analítica.',
                tipo: "A-E",
                opcoes: ["A) As férias dos policiais seriam suspensas pelo governo estadual.", "B) As férias dos policiais foram suspensas pelo governo estadual.", "C) As férias dos policiais são suspensas pelo governo estadual.", "D) As férias dos policiais serão suspensas pelo governo estadual.", "E) Suspender-se-ão as férias dos policiais pelo governo estadual.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) As férias dos policiais serão suspensas pelo governo estadual."
            },
            {
                id: 10,
                pergunta: 'No período "A atuação do núcleo de inteligência é imprescindível, pois não prescinde de tecnologia avançada", o termo "prescinde" pode ser substituído, mantendo o sentido original de "não abrir mão/não dispensar", por:',
                tipo: "A-E",
                opcoes: ["A) Carece.", "B) Dispensa.", "C) Exige.", "D) Necessita.", "E) Demanda.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Dispensa."
            },
            {
                id: 11,
                pergunta: 'Assinale a frase que respeita a norma culta quanto à concordância nominal.',
                tipo: "A-E",
                opcoes: ["A) A testemunha principal parecia meio confusa durante a acareação.", "B) É proibido a entrada de pessoas não autorizadas na cena do crime.", "C) Segue anexo ao e-mail as certidões criminais solicitadas pelo juiz.", "D) A própria vítima forneceu bastantes detalhes precisos, ela mesmo.", "E) Os policiais militares mantiveram-se alertas durante toda a madrugada.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) A testemunha principal parecia meio confusa durante a acareação."
            },
            {
                id: 12,
                pergunta: 'No trecho "O delegado remeteu os autos ao juiz, o qual determinou a prisão preventiva", o pronome "o qual" exerce o papel coesivo de retomar a qual antecedente?',
                tipo: "A-E",
                opcoes: ["A) O delegado.", "B) Os autos.", "C) O juiz.", "D) A prisão preventiva.", "E) O remetente.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) O juiz."
            },
            {
                id: 13,
                pergunta: 'A regência nominal está corretamente aplicada na frase:',
                tipo: "A-E",
                opcoes: ["A) O gestor tem verdadeira aversão por burocracias desnecessárias.", "B) O servidor recém-empossado demonstrou estar apto em suas funções.", "C) A atitude do motorista embriagado foi incompatível a legislação.", "D) O comandante estava ansioso para o início da operação policial.", "E) A decisão judicial foi simultânea com a publicação no diário oficial.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) O gestor tem verdadeira aversão por burocracias desnecessárias."
            },
            {
                id: 14,
                pergunta: 'Na frase "O escrivão finalizou os depoimentos, não os enviou, porém, ao fórum", a conjunção deslocada entre vírgulas estabelece com a oração anterior um sentido de:',
                tipo: "A-E",
                opcoes: ["A) Adição.", "B) Explicação.", "C) Conclusão.", "D) Alternância.", "E) Adversidade.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Adversidade."
            },
            {
                id: 15,
                pergunta: 'Na oração "A crítica do advogado irritou profundamente a promotoria", o termo "do advogado" classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: ["A) Complemento nominal.", "B) Objeto indireto.", "C) Agente da passiva.", "D) Adjunto adnominal.", "E) Predicativo do sujeito.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Adjunto adnominal."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
