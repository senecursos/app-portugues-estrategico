<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (20 QUESTÕES)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: "Assinale a alternativa que contém exclusivamente verbos:",
                tipo: "A-E",
                opcoes: ["A) parecer, trâmite, deferir, ofício, exarar", "B) relatar, certidão, validar, citação, anular", "C) intervir, reaver, expedia, homologaram, prever", "D) mandato, expedir, averbado, posse, outorgar", "E) requerer, licitação, aprovar, vigência, deferido", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) intervir, reaver, expedia, homologaram, prever"
            },
            {
                id: 2,
                pergunta: "Identifique a opção cujas cinco palavras exercem a função de verbo:",
                tipo: "A-E",
                opcoes: ["A) interpusera, arguimos, adequassem, reterão, contradisse", "B) impugnação, recorreu, acórdão, legislar, veto", "C) sentenciou, jurisprudência, penaliza, dolo, culposo", "D) instauração, inquérito, absolveu, réu, sentenciar", "E) protelou, embargo, diligência, cumprirá, tempestivo", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) interpusera, arguimos, adequassem, reterão, contradisse"
            },
            {
                id: 3,
                pergunta: "Assinale a alternativa em que todos os vocábulos pertencem à classe verbal:",
                tipo: "A-E",
                opcoes: ["A) certame, ofício, proferiu, sanção, ratificar", "B) concessão, pleiteou, revelia, citar, litígio", "C) vigora, estatuto, sancionou, portaria, emitir", "D) deliberamos, auferir, revogariam, prescreverá, restituíram", "E) provisão, deferiu, alínea, revogar, parecerista", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) deliberamos, auferir, revogariam, prescreverá, restituíram"
            },
            {
                id: 4,
                pergunta: "Indique a alternativa formada unicamente por verbos:",
                tipo: "A-E",
                opcoes: ["A) julgamento, procedeu, arquivamento, deferirá, acatamento", "B) averiguar, notificassem, desdobrará, redigimos, interpusesse", "C) relatoria, adiar, tribunal, encerramento, divergir", "D) atestar, anuência, indeferir, recurso, homologar", "E) impetrar, mandado, segurança, concedeu, liminar", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) averiguar, notificassem, desdobrará, redigimos, interpusesse"
            },
            {
                id: 5,
                pergunta: 'Na oração "O auditor alertara a chefia sobre as inconsistências muito antes da deflagração da operação policial", o verbo "alertara" encontra-se no:',
                tipo: "A-E",
                opcoes: ["A) Pretérito imperfeito do indicativo.", "B) Futuro do presente do indicativo.", "C) Pretérito perfeito do indicativo.", "D) Futuro do pretérito do indicativo.", "E) Pretérito mais-que-perfeito do indicativo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Pretérito mais-que-perfeito do indicativo."
            },
            {
                id: 6,
                pergunta: 'No período "A comissão parlamentar aprovaria o texto base da reforma administrativa caso os acordos partidários fossem mantidos", o verbo "aprovaria" está conjugado no:',
                tipo: "A-E",
                opcoes: ["A) Futuro do pretérito do indicativo.", "B) Pretérito imperfeito do indicativo.", "C) Futuro do presente do indicativo.", "D) Pretérito perfeito do indicativo.", "E) Presente do indicativo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Futuro do pretérito do indicativo."
            },
            {
                id: 7,
                pergunta: 'Na frase "O conselheiro exigia a apresentação imediata dos relatórios fiscais em todas as reuniões ordinárias do trimestre", a forma verbal "exigia" classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Futuro do pretérito do indicativo.", "B) Pretérito perfeito do indicativo.", "C) Pretérito mais-que-perfeito do indicativo.", "D) Pretérito imperfeito do indicativo.", "E) Presente do indicativo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Pretérito imperfeito do indicativo."
            },
            {
                id: 8,
                pergunta: 'No trecho "O corregedor-geral requer a instauração imediata de sindicância para apurar as condutas dos servidores envolvidos", o verbo "requer" encontra-se no:',
                tipo: "A-E",
                opcoes: ["A) Pretérito perfeito do indicativo.", "B) Presente do indicativo.", "C) Futuro do presente do indicativo.", "D) Pretérito imperfeito do indicativo.", "E) Pretérito mais-que-perfeito do indicativo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Presente do indicativo."
            },
            {
                id: 9,
                pergunta: 'No período "O poder judiciário interveio rapidamente no litígio patrimonial para evitar a dilapidação dos bens da autarquia", a forma verbal "interveio" está flexionada no:',
                tipo: "A-E",
                opcoes: ["A) Pretérito imperfeito do indicativo.", "B) Presente do indicativo.", "C) Futuro do pretérito do indicativo.", "D) Pretérito perfeito do indicativo.", "E) Pretérito mais-que-perfeito do indicativo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Pretérito perfeito do indicativo."
            },
            {
                id: 10,
                pergunta: 'Na oração "A procuradoria do estado interporá recurso extraordinário contra a decisão proferida pelo tribunal de justiça", o verbo "interporá" classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Futuro do presente do indicativo.", "B) Futuro do pretérito do indicativo.", "C) Pretérito mais-que-perfeito do indicativo.", "D) Presente do indicativo.", "E) Pretérito imperfeito do indicativo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Futuro do presente do indicativo."
            },
            {
                id: 11,
                pergunta: 'Na oração "Anularam-se as cláusulas abusivas do contrato de prestação de serviços", o verbo encontra-se na:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Voz passiva sintética."
            },
            {
                id: 12,
                pergunta: 'No período "O plenário do tribunal aprovou a alteração do regimento interno por unanimidade", o verbo está flexionado na:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Voz ativa."
            },
            {
                id: 13,
                pergunta: 'Na frase "O gestor investigado defendeu-se das graves denúncias de peculato durante a coletiva de imprensa", a voz verbal classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Voz reflexiva."
            },
            {
                id: 14,
                pergunta: 'No trecho "Os pareceres contábeis foram rejeitados pela auditoria externa na manhã de ontem", o verbo apresenta-se na:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Voz passiva analítica."
            },
            {
                id: 15,
                pergunta: 'Na oração "Os parlamentares ofenderam-se gravemente no decorrer da comissão parlamentar de inquérito", ocorre o emprego da:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Voz reflexiva recíproca."
            },
            {
                id: 16,
                pergunta: 'No período "Julgou-se procedente o pedido de indenização formulado pelo servidor público civil", a estrutura verbal configura a:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Voz passiva sintética."
            },
            {
                id: 17,
                pergunta: 'Na frase "A nova legislação tributária foi sancionada pelo chefe do poder executivo sem vetos", a voz do verbo é classificada como:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Voz passiva analítica."
            },
            {
                id: 18,
                pergunta: 'No trecho "O procurador-geral arquivou o inquérito civil por absoluta falta de provas documentais", o verbo encontra-se na:',
                tipo: "A-E",
                opcoes: ["A) Voz ativa.", "B) Voz passiva analítica.", "C) Voz passiva sintética.", "D) Voz reflexiva.", "E) Voz reflexiva recíproca.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Voz ativa."
            },
            {
                id: 19,
                pergunta: "Nenhum auditor encontrou falhas graves.",
                tipo: "A-E",
                opcoes: ["A) Pronome, adjetivo, verbo, substantivo, advérbio.", "B) Adjetivo, substantivo, verbo, pronome, adjetivo.", "C) Pronome, substantivo, verbo, substantivo, adjetivo.", "D) Advérbio, substantivo, verbo, adjetivo, substantivo.", "E) Substantivo, adjetivo, verbo, substantivo, advérbio.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Pronome, substantivo, verbo, substantivo, adjetivo."
            },
            {
                id: 20,
                pergunta: "Arquivaram o processo por prescrição.",
                tipo: "A-E",
                opcoes: ["A) Verbo, pronome, substantivo, conjunção, adjetivo.", "B) Verbo, artigo, substantivo, preposição, substantivo.", "C) Substantivo, artigo, adjetivo, preposição, verbo.", "D) Verbo, artigo, adjetivo, advérbio, substantivo.", "E) Advérbio, pronome, substantivo, preposição, adjetivo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Verbo, artigo, substantivo, preposição, substantivo."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
