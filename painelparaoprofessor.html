<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (12 QUESTÕES: SINTAXE - FUNÇÕES SINTÁTICAS)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: '(Estilo AOCP) Na oração "O inquérito policial permaneceu sigiloso durante toda a investigação", o termo "sigiloso" exerce a função sintática de:',
                tipo: "A-E",
                opcoes: ["A) Objeto direto.", "B) Predicativo do sujeito.", "C) Predicativo do objeto.", "D) Adjunto adnominal.", "E) Complemento nominal.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Predicativo do sujeito."
            },
            {
                id: 2,
                pergunta: '(Estilo Cebraspe) Considerando as relações morfossintáticas do período "O mandado de busca e apreensão foi expedido pelo juiz da comarca", a expressão "pelo juiz da comarca" atua como o agente da ação verbal estruturada na voz passiva. Assinale a opção que indica a correta classificação desse termo:',
                tipo: "A-E",
                opcoes: ["A) Sujeito simples.", "B) Objeto indireto.", "C) Adjunto adverbial de causa.", "D) Agente da passiva.", "E) Complemento nominal.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Agente da passiva."
            },
            {
                id: 3,
                pergunta: '(Estilo AOCP) Na frase "A comissão de delegados concluiu o minucioso relatório final na manhã de hoje", o termo "o minucioso relatório final" é classificado sintaticamente como:',
                tipo: "A-E",
                opcoes: ["A) Objeto direto.", "B) Predicativo do sujeito.", "C) Sujeito simples.", "D) Complemento nominal.", "E) Objeto indireto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Objeto direto."
            },
            {
                id: 4,
                pergunta: '(Estilo Cebraspe) No trecho "A equipe de investigação demonstrou necessidade de apoio tático imediato", o termo "de apoio tático imediato" liga-se a um nome transitivo (um substantivo abstrato) que integra o complemento do verbo. Dessa forma, a sua correta função sintática é:',
                tipo: "A-E",
                opcoes: ["A) Objeto direto.", "B) Objeto indireto.", "C) Complemento nominal.", "D) Adjunto adnominal.", "E) Predicativo do objeto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Complemento nominal."
            },
            {
                id: 5,
                pergunta: '(Estilo AOCP) Na oração "O tribunal de justiça considerou o recurso da defesa improcedente", o termo "improcedente" exerce a função sintática de:',
                tipo: "A-E",
                opcoes: ["A) Complemento nominal.", "B) Adjunto adnominal.", "C) Predicativo do sujeito.", "D) Objeto indireto.", "E) Predicativo do objeto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Predicativo do objeto."
            },
            {
                id: 6,
                pergunta: '(Estilo Cebraspe) Tendo em vista a regência do verbo no trecho "O corregedor-geral da corporação não obedeceu aos prazos processuais estipulados", o segmento "aos prazos processuais estipulados" funciona sintaticamente como:',
                tipo: "A-E",
                opcoes: ["A) Objeto indireto.", "B) Complemento nominal.", "C) Agente da passiva.", "D) Adjunto adverbial.", "E) Objeto direto preposicionado.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Objeto indireto."
            },
            {
                id: 7,
                pergunta: '(Estilo AOCP) No período "As viaturas descaracterizadas foram identificadas pelos peritos criminais", o termo "pelos peritos criminais" classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito simples.", "B) Objeto indireto.", "C) Agente da passiva.", "D) Adjunto adverbial de meio.", "E) Complemento nominal.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Agente da passiva."
            },
            {
                id: 8,
                pergunta: '(Estilo Cebraspe) Na oração "Durante a operação deflagrada na madrugada, os agentes de segurança apreenderam vasto material ilícito", o segmento "vasto material ilícito" completa o sentido de um verbo nocional transitivo sem o auxílio de preposição obrigatória. Esse termo classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito composto.", "B) Predicativo do objeto.", "C) Adjunto adverbial de tempo.", "D) Objeto indireto.", "E) Objeto direto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Objeto direto."
            },
            {
                id: 9,
                pergunta: '(Estilo AOCP) Na frase "O secretário de segurança pública atribuiu a falha operacional ao antigo comandante", o termo "ao antigo comandante" exerce a função sintática de:',
                tipo: "A-E",
                opcoes: ["A) Complemento nominal.", "B) Objeto indireto.", "C) Predicativo do objeto.", "D) Agente da passiva.", "E) Adjunto adnominal.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Objeto indireto."
            },
            {
                id: 10,
                pergunta: '(Estilo Cebraspe) No segmento "A imprensa local nomeou o experiente investigador chefe da força-tarefa", a expressão "chefe da força-tarefa" atribui uma qualidade ou estado ao termo que sofre a ação verbal na estrutura transitiva. Essa função sintática é denominada:',
                tipo: "A-E",
                opcoes: ["A) Sujeito.", "B) Predicativo do sujeito.", "C) Complemento nominal.", "D) Predicativo do objeto.", "E) Aposto explicativo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Predicativo do objeto."
            },
            {
                id: 11,
                pergunta: '(Estilo AOCP) No trecho "Os candidatos aprovados no concurso da polícia civil visavam a cargos de alta gestão", o termo "a cargos de alta gestão" classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Objeto direto.", "B) Complemento nominal.", "C) Predicativo do sujeito.", "D) Adjunto adverbial.", "E) Objeto indireto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Objeto indireto."
            },
            {
                id: 12,
                pergunta: '(Estilo Cebraspe) No contexto da oração "Após o extenso interrogatório, a principal testemunha do caso parecia atônita", o vocábulo "atônita" exprime um estado atribuído ao núcleo do sujeito da oração por intermédio de um verbo relacional. Sintaticamente, classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Predicativo do sujeito.", "B) Adjunto adverbial de modo.", "C) Predicativo do objeto.", "D) Objeto direto.", "E) Adjunto adnominal.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Predicativo do sujeito."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
