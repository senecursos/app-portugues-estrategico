<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (20 QUESTÕES: MORFOLOGIA E SINTAXE)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'Na frase "O amanhã trará respostas definitivas para o impasse do conselho", a palavra "amanhã" classifica-se morfologicamente como:',
                tipo: "A-E",
                opcoes: ["A) Advérbio de tempo.", "B) Substantivo.", "C) Adjetivo.", "D) Conjunção coordenada.", "E) Preposição.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Substantivo."
            },
            {
                id: 2,
                pergunta: 'No trecho "A testemunha do caso depôs alto durante a acareação judicial", a palavra "alto" atua gramaticalmente como:',
                tipo: "A-E",
                opcoes: ["A) Adjetivo.", "B) Substantivo.", "C) Advérbio.", "D) Preposição.", "E) Pronome indefinido.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Advérbio."
            },
            {
                id: 3,
                pergunta: 'Na oração "Entreguei a notificação a ela e nunca mais a vi", as palavras "a", "a" e "a" classificam-se, na exata ordem em que aparecem, como:',
                tipo: "A-E",
                opcoes: ["A) Artigo, artigo, pronome.", "B) Preposição, artigo, preposição.", "C) Artigo, preposição, pronome.", "D) Pronome, preposição, artigo.", "E) Preposição, preposição, pronome.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Artigo, preposição, pronome."
            },
            {
                id: 4,
                pergunta: 'Na frase "Os auditores estavam muito cansados, pois analisaram muitos documentos", as palavras "muito" e "muitos" pertencem, respectivamente, às seguintes classes:',
                tipo: "A-E",
                opcoes: ["A) Advérbio e pronome indefinido.", "B) Pronome indefinido e advérbio.", "C) Adjetivo e pronome indefinido.", "D) Advérbio e adjetivo.", "E) Pronome indefinido e adjetivo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Advérbio e pronome indefinido."
            },
            {
                id: 5,
                pergunta: 'No período "Apenas um candidato apresentou a documentação exigida no prazo", a palavra "um" exerce rigorosamente a função morfológica de:',
                tipo: "A-E",
                opcoes: ["A) Artigo indefinido.", "B) Pronome demonstrativo.", "C) Pronome indefinido.", "D) Numeral.", "E) Substantivo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Numeral."
            },
            {
                id: 6,
                pergunta: 'Na oração "O julgamento, pois, foi adiado para o próximo semestre letivo", a palavra "pois" pertence à classe das:',
                tipo: "A-E",
                opcoes: ["A) Preposições acidentais.", "B) Interjeições.", "C) Conjunções coordenadas aditivas.", "D) Conjunções coordenadas explicativas.", "E) Conjunções coordenadas conclusivas.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Conjunções coordenadas conclusivas."
            },
            {
                id: 7,
                pergunta: 'Em "A secretária de finanças mostrou-se meio confusa diante das novas diretrizes orçamentárias", o termo "meio" classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Adjetivo.", "B) Numeral fracionário.", "C) Substantivo.", "D) Advérbio.", "E) Pronome indefinido.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Advérbio."
            },
            {
                id: 8,
                pergunta: 'Na frase "Os seguranças do patrimônio permaneceram alerta durante toda a madrugada", a palavra "alerta" atua morfologicamente como:',
                tipo: "A-E",
                opcoes: ["A) Substantivo.", "B) Verbo.", "C) Adjetivo.", "D) Advérbio.", "E) Interjeição.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Advérbio."
            },
            {
                id: 9,
                pergunta: 'No trecho "O que a controladoria decidiu foi imediatamente acatado pelo prefeito", a palavra "O" posicionada no início da frase classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Artigo definido.", "B) Pronome pessoal oblíquo.", "C) Pronome demonstrativo.", "D) Pronome relativo.", "E) Preposição acidental.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Pronome demonstrativo."
            },
            {
                id: 10,
                pergunta: 'Em "Nossa! O relatório orçamentário apresenta falhas grotescas", a palavra "Nossa" atua no contexto como:',
                tipo: "A-E",
                opcoes: ["A) Pronome possessivo.", "B) Pronome demonstrativo.", "C) Interjeição.", "D) Adjetivo.", "E) Substantivo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Interjeição."
            },
            {
                id: 11,
                pergunta: 'Na frase "Mediante acordo prévio entre as partes, as cláusulas penais foram alteradas", a palavra "Mediante" classifica-se morfologicamente como:',
                tipo: "A-E",
                opcoes: ["A) Advérbio de modo.", "B) Conjunção coordenada.", "C) Adjetivo.", "D) Verbo.", "E) Preposição.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Preposição."
            },
            {
                id: 12,
                pergunta: 'Na oração "A autarquia dispunha de bastantes recursos para investir em infraestrutura", o termo "bastantes" atua como:',
                tipo: "A-E",
                opcoes: ["A) Advérbio de intensidade.", "B) Pronome indefinido.", "C) Adjetivo qualificativo.", "D) Substantivo comum.", "E) Preposição essencial.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Pronome indefinido."
            },
            {
                id: 13,
                pergunta: 'Na frase "Constatou-se a grave falha na prestação de contas do gestor", a função do vocábulo "se" e a classificação do sujeito da oração são, respectivamente:',
                tipo: "A-E",
                opcoes: ["A) Índice de indeterminação do sujeito / Sujeito indeterminado.", "B) Pronome reflexivo / Sujeito oculto.", "C) Partícula apassivadora / Sujeito simples.", "D) Partícula integrante do verbo / Sujeito inexistente.", "E) Partícula apassivadora / Sujeito composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Partícula apassivadora / Sujeito simples."
            },
            {
                id: 14,
                pergunta: 'Em "Necessita-se de novos equipamentos de segurança no setor de triagem", a oração apresenta:',
                tipo: "A-E",
                opcoes: ["A) Partícula apassivadora e sujeito simples.", "B) Índice de indeterminação do sujeito e sujeito indeterminado.", "C) Pronome reflexivo e sujeito indeterminado.", "D) Índice de indeterminação do sujeito e oração sem sujeito.", "E) Partícula de realce e sujeito oculto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Índice de indeterminação do sujeito e sujeito indeterminado."
            },
            {
                id: 15,
                pergunta: 'No período "Os conselheiros consideraram a prova técnica exaustiva", a classificação correta do predicado é:',
                tipo: "A-E",
                opcoes: ["A) Predicado verbal.", "B) Predicado simples.", "C) Predicado nominal.", "D) Predicado verbo-nominal.", "E) Predicado composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Predicado verbo-nominal."
            },
            {
                id: 16,
                pergunta: 'Na oração "Houve diversos questionamentos ríspidos durante a sessão plenária", o sujeito classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito composto.", "B) Sujeito simples.", "C) Sujeito indeterminado.", "D) Sujeito oculto.", "E) Sujeito inexistente (oração sem sujeito).", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Sujeito inexistente (oração sem sujeito)."
            },
            {
                id: 17,
                pergunta: 'Em "Os parlamentares ofenderam-se gravemente no decorrer do debate", a voz verbal e a função do termo "se" são, respectivamente:',
                tipo: "A-E",
                opcoes: ["A) Voz passiva sintética / Partícula apassivadora.", "B) Voz ativa / Índice de indeterminação do sujeito.", "C) Voz reflexiva recíproca / Pronome reflexivo.", "D) Voz passiva analítica / Pronome demonstrativo.", "E) Voz reflexiva / Partícula integrante do verbo.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Voz reflexiva recíproca / Pronome reflexivo."
            },
            {
                id: 18,
                pergunta: 'Na frase "O edital de licitação foi impugnado pelo conselho regional de engenharia", a voz do verbo e o tipo de sujeito são:',
                tipo: "A-E",
                opcoes: ["A) Voz passiva sintética / Sujeito composto.", "B) Voz ativa / Sujeito simples.", "C) Voz reflexiva / Sujeito indeterminado.", "D) Voz passiva analítica / Sujeito simples.", "E) Voz ativa / Sujeito oculto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Voz passiva analítica / Sujeito simples."
            },
            {
                id: 19,
                pergunta: 'Em "O diretor do departamento andava preocupado com as novas metas fiscais", o predicado classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Predicado verbo-nominal.", "B) Predicado verbal.", "C) Predicado simples.", "D) Predicado nominal.", "E) Predicado composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Predicado nominal."
            },
            {
                id: 20,
                pergunta: 'Analise a estrutura "Alugaram-se várias salas comerciais no centro da capital". A oração encontra-se na:',
                tipo: "A-E",
                opcoes: ["A) Voz passiva sintética, possuindo sujeito simples.", "B) Voz ativa, possuindo sujeito indeterminado.", "C) Voz passiva analítica, possuindo sujeito composto.", "D) Voz ativa, possuindo sujeito simples.", "E) Voz reflexiva, possuindo sujeito inexistente.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Voz passiva sintética, possuindo sujeito simples."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
