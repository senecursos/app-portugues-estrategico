<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (15 QUESTÕES: ORAÇÕES SUBORDINADAS)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'No período "A corporação policial mantinha firme convicção DE QUE AS DILIGÊNCIAS IDENTIFICARIAM OS MANDANTES DO CRIME", a oração destacada classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva objetiva indireta.",
                    "B) subordinada adjetiva restritiva.",
                    "C) subordinada substantiva completiva nominal.",
                    "D) subordinada substantiva apositiva.",
                    "E) subordinada substantiva predicativa.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) subordinada substantiva completiva nominal."
            },
            {
                id: 2,
                pergunta: 'Considerando as relações sintáticas estabelecidas no período "Os peritos criminais recolheram todos os vestígios QUE PERMANECIAM INTACTOS NA CENA DO DELITO", assinale a opção correta acerca da oração em destaque.',
                tipo: "A-E",
                opcoes: [
                    "A) Classifica-se como subordinada substantiva objetiva direta, pois completa o sentido transitivo do verbo recolheram.",
                    "B) Classifica-se como subordinada adjetiva explicativa, já que generaliza uma propriedade inerente a todos os vestígios.",
                    "C) Classifica-se como subordinada substantiva completiva nominal, visto que especifica o substantivo concreto vestígios.",
                    "D) Classifica-se como subordinada adjetiva restritiva, uma vez que delimita o sentido do substantivo antecedente sem emprego de vírgulas.",
                    "E) Classifica-se como subordinada substantiva apositiva, por esclarecer a natureza dos elementos coletados pela perícia.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Classifica-se como subordinada adjetiva restritiva, uma vez que delimita o sentido do substantivo antecedente sem emprego de vírgulas."
            },
            {
                id: 3,
                pergunta: 'Assinale a alternativa que apresenta a classificação sintática correta da oração destacada em "Ficou comprovado durante a audiência de custódia QUE O ACUSADO PORTAVA DOCUMENTO FALSO".',
                tipo: "A-E",
                opcoes: [
                    "A) Subordinada substantiva objetiva direta.",
                    "B) Subordinada substantiva predicativa.",
                    "C) Subordinada substantiva subjetiva.",
                    "D) Subordinada adjetiva restritiva.",
                    "E) Subordinada substantiva completiva nominal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Subordinada substantiva subjetiva."
            },
            {
                id: 4,
                pergunta: 'No período "O sindicato dos servidores públicos opôs-se firmemente A QUE O NOVO REGULAMENTO DISCIPLINAR FOSSE APROVADO SEM DEBATE", a oração destacada classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva completiva nominal, pois completa o sentido do advérbio firmemente.",
                    "B) subordinada substantiva objetiva indireta, visto que complementa a transitividade indireta da forma verbal opôs-se.",
                    "C) subordinada adjetiva restritiva, uma vez que o vocábulo que retoma o substantivo regulamento.",
                    "D) subordinada substantiva subjetiva, já que funciona como sujeito paciente do verbo pronominal.",
                    "E) subordinada substantiva apositiva, por explicitar o objeto da discordância sindical.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) subordinada substantiva objetiva indireta, visto que complementa a transitividade indireta da forma verbal opôs-se."
            },
            {
                id: 5,
                pergunta: 'Em "A principal hipótese levantada pelos investigadores era QUE O INCÊNDIO HAVIA SIDO PROVOCADO INTENCIONALMENTE", a oração destacada exerce a função de oração:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva subjetiva.",
                    "B) subordinada substantiva objetiva direta.",
                    "C) subordinada adjetiva explicativa.",
                    "D) subordinada substantiva apositiva.",
                    "E) subordinada substantiva predicativa.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) subordinada substantiva predicativa."
            },
            {
                id: 6,
                pergunta: 'Considerando a estrutura sintática e a pontuação do período "O Ministério Público estadual, CUJA ATUAÇÃO INDEPENDENTE ASSEGURA A DEFESA DA ORDEM JURÍDICA, ofereceu denúncia contra os envolvidos", assinale a opção correta sobre a oração em destaque.',
                tipo: "A-E",
                opcoes: [
                    "A) Trata-se de oração subordinada adjetiva explicativa, introduzida por pronome relativo e isolada por vírgulas por acrescentar informação acessória ao antecedente.",
                    "B) Trata-se de oração subordinada adjetiva restritiva, pois delimita qual ramo do Ministério Público ofereceu a denúncia criminal.",
                    "C) Trata-se de oração subordinada substantiva apositiva, uma vez que aparece intercalada entre vírgulas logo após o sujeito.",
                    "D) Trata-se de oração subordinada substantiva completiva nominal, visto que completa o sentido do adjetivo estadual.",
                    "E) Trata-se de oração subordinada substantiva subjetiva, já que exerce a função de núcleo do sujeito da oração principal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) Trata-se de oração subordinada adjetiva explicativa, introduzida por pronome relativo e isolada por vírgulas por acrescentar informação acessória ao antecedente."
            },
            {
                id: 7,
                pergunta: 'No período "O juiz titular estabeleceu uma única condição para conceder a liberdade provisória: QUE O RÉU COMPARECESSE MENSALMENTE EM JUÍZO", a oração em destaque classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva predicativa.",
                    "B) subordinada substantiva objetiva direta.",
                    "C) subordinada adjetiva explicativa.",
                    "D) subordinada substantiva apositiva.",
                    "E) subordinada substantiva completiva nominal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) subordinada substantiva apositiva."
            },
            {
                id: 8,
                pergunta: 'No trecho "Durante a coletiva de imprensa, o delegado regional confirmou QUE AS EQUIPES TÁTICAS HAVIAM INTERCEPTADO O CARREGAMENTO ILÍCITO", a oração destacada classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva subjetiva, pois o sujeito do verbo confirmou encontra-se posposto na oração subordinada.",
                    "B) subordinada substantiva objetiva direta, uma vez que funciona como complemento não preposicionado do verbo transitivo direto confirmou.",
                    "C) subordinada substantiva predicativa, visto que atribui uma declaração ao sujeito o delegado regional.",
                    "D) subordinada adjetiva restritiva, já que o vocábulo que restringe o sentido da expressão coletiva de imprensa.",
                    "E) subordinada substantiva completiva nominal, por complementar a noção expressa pelo substantivo imprensa.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) subordinada substantiva objetiva direta, uma vez que funciona como complemento não preposicionado do verbo transitivo direto confirmou."
            },
            {
                id: 9,
                pergunta: 'Assinale a alternativa que classifica corretamente a oração destacada em "A viatura descaracterizada EM QUE OS AGENTES REALIZAVAM O PATRULHAMENTO SIGILOSO foi recolhida para manutenção".',
                tipo: "A-E",
                opcoes: [
                    "A) Subordinada substantiva objetiva indireta.",
                    "B) Subordinada adjetiva explicativa.",
                    "C) Subordinada substantiva completiva nominal.",
                    "D) Subordinada adjetiva restritiva.",
                    "E) Subordinada substantiva apositiva.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Subordinada adjetiva restritiva."
            },
            {
                id: 10,
                pergunta: 'Considerando a regência nominal e as relações sintáticas do período "O parecer técnico da procuradoria mostrou-se favorável A QUE O CONTRATO ADMINISTRATIVO FOSSE ANULADO POR VÍCIO FORMAL", assinale a opção correta acerca da oração destacada.',
                tipo: "A-E",
                opcoes: [
                    "A) Classifica-se como subordinada substantiva objetiva indireta, pois é regida pela preposição a exigida pelo verbo mostrou-se.",
                    "B) Classifica-se como subordinada adjetiva restritiva, visto que o pronome relativo que retoma o termo parecer técnico.",
                    "C) Classifica-se como subordinada substantiva completiva nominal, uma vez que integra o sentido transitivo do adjetivo favorável.",
                    "D) Classifica-se como subordinada substantiva predicativa, já que funciona como predicativo do sujeito parecer técnico.",
                    "E) Classifica-se como subordinada substantiva subjetiva, por constituir o sujeito oracional da locução verbal mostrou-se.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Classifica-se como subordinada substantiva completiva nominal, uma vez que integra o sentido transitivo do adjetivo favorável."
            },
            {
                id: 11,
                pergunta: 'Em "Os peritos do instituto de criminalística necessitam DE QUE O LABORATÓRIO ENTREGUE OS EXAMES TOXICOLÓGICOS COM URGÊNCIA", a oração em destaque classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva completiva nominal.",
                    "B) subordinada substantiva subjetiva.",
                    "C) subordinada adjetiva restritiva.",
                    "D) subordinada substantiva objetiva direta.",
                    "E) subordinada substantiva objetiva indireta.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) subordinada substantiva objetiva indireta."
            },
            {
                id: 12,
                pergunta: 'No período "Urge QUE AS AUTORIDADES COMPETENTES REFORCEM A FISCALIZAÇÃO NAS RODOVIAS FEDERAIS DURANTE O FERIADO", a oração destacada classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva subjetiva, pois exerce a função de sujeito da forma verbal unipessoal urge.",
                    "B) subordinada substantiva objetiva direta, visto que complementa a transitividade direta do verbo urge.",
                    "C) subordinada substantiva predicativa, uma vez que qualifica o sujeito oculto da oração principal.",
                    "D) subordinada adjetiva restritiva, já que especifica a urgência mencionada no início do período.",
                    "E) subordinada substantiva apositiva, por esclarecer o motivo da fiscalização nas rodovias federais.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) subordinada substantiva subjetiva, pois exerce a função de sujeito da forma verbal unipessoal urge."
            },
            {
                id: 13,
                pergunta: 'Assinale a alternativa que identifica corretamente a oração destacada no período "A Constituição Federal de 1988, QUE GARANTE O DIREITO À AMPLA DEFESA E AO CONTRADITÓRIO, orienta todo o ordenamento jurídico".',
                tipo: "A-E",
                opcoes: [
                    "A) Subordinada substantiva apositiva.",
                    "B) Subordinada adjetiva explicativa.",
                    "C) Subordinada adjetiva restritiva.",
                    "D) Subordinada substantiva predicativa.",
                    "E) Subordinada substantiva subjetiva.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Subordinada adjetiva explicativa."
            },
            {
                id: 14,
                pergunta: 'Considerando as funções sintáticas das orações no período "A impressão unânime dos auditores fiscais parecia ser QUE OS DOCUMENTOS CONTÁBEIS HAVIAM SIDO ADULTERADOS", assinale a opção correta quanto à oração destacada.',
                tipo: "A-E",
                opcoes: [
                    "A) Classifica-se como subordinada substantiva objetiva direta, pois completa o sentido da locução verbal parecia ser.",
                    "B) Classifica-se como subordinada substantiva subjetiva, já que exerce a função de sujeito posposto da locução parecia ser.",
                    "C) Classifica-se como subordinada adjetiva restritiva, visto que delimita o sentido do substantivo auditores fiscais.",
                    "D) Classifica-se como subordinada substantiva predicativa, uma vez que sucede uma locução verbal de ligação e atribui predicação ao sujeito.",
                    "E) Classifica-se como subordinada substantiva completiva nominal, por complementar o sentido do adjetivo unânime.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Classifica-se como subordinada substantiva predicativa, uma vez que sucede uma locução verbal de ligação e atribui predicação ao sujeito."
            },
            {
                id: 15,
                pergunta: 'No período "A corregedoria-geral verificará SE HOUVE OMISSÃO DE SOCORRO POR PARTE DA GUARNIÇÃO DE SERVIÇO", a oração em destaque classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) subordinada substantiva objetiva indireta.",
                    "B) subordinada adjetiva restritiva.",
                    "C) subordinada substantiva objetiva direta.",
                    "D) subordinada substantiva subjetiva.",
                    "E) subordinada substantiva predicativa.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) subordinada substantiva objetiva direta."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
