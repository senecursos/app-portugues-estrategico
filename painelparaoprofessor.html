<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (20 QUESTÕES: REVISÃO GERAL DE GRAMÁTICA)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'Assinale a alternativa em que todas as palavras são acentuadas exatamente pela mesma regra gramatical.',
                tipo: "A-E",
                opcoes: [
                    "A) MÉDICO, JÚRI, CAFÉ",
                    "B) SAÍDA, ÁLBUM, CIPÓ",
                    "C) HERÓI, ANÉIS, TROFÉU",
                    "D) LÂMPADA, FÁCIL, PARABÉNS",
                    "E) TÓRAX, RELÂMPAGO, VOVÔ",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) HERÓI, ANÉIS, TROFÉU"
            },
            {
                id: 2,
                pergunta: 'Considerando as regras de acentuação gráfica vigentes, assinale a opção correta a respeito das palavras do período: "O perito detém as provas, mas ninguém intervém na análise dos resíduos encontrados no veículo."',
                tipo: "A-E",
                opcoes: [
                    "A) O vocábulo NINGUÉM recebe acento agudo por ser uma paroxítona terminada em ditongo nasal.",
                    "B) As palavras ANÁLISE e RESÍDUOS pertencem à mesma classificação tônica e seguem idêntica regra de acentuação.",
                    "C) Caso o substantivo VEÍCULO fosse empregado no plural, perderia o acento gráfico devido ao deslocamento da sílaba tônica.",
                    "D) A forma verbal DETÉM, se flexionada na terceira pessoa do plural, perderia o acento gráfico conforme o acordo ortográfico.",
                    "E) Os vocábulos DETÉM e INTERVÉM são acentuados por serem oxítonos terminados em E seguido de M.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) Os vocábulos DETÉM e INTERVÉM são acentuados por serem oxítonos terminados em E seguido de M."
            },
            {
                id: 3,
                pergunta: 'Assinale a alternativa em que todas as palavras estão grafadas e acentuadas corretamente conforme a norma-padrão vigente.',
                tipo: "A-E",
                opcoes: [
                    "A) IDÉIA, HERÓICO, JIBOIA, PÁRA (verbo)",
                    "B) FEIURA, PLATEIA, VOO, PÔR (verbo)",
                    "C) ENJÔO, APÓIO (verbo), BOCAIÚVA, PÊLO (substantivo)",
                    "D) ASSEMBLEIA, COLMEIA, BAIÚCA, PÔDE (pretérito)",
                    "E) COROÔ, ABENÇOO, PARANOIA, TÊM (plural)",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) FEIURA, PLATEIA, VOO, PÔR (verbo)"
            },
            {
                id: 4,
                pergunta: 'No trecho "O SUBDELEGADO constatou a INCOERÊNCIA do relato ao ANOITECER", os processos de formação das palavras em destaque são, respectivamente:',
                tipo: "A-E",
                opcoes: [
                    "A) derivação prefixal, derivação parassintética, derivação regressiva.",
                    "B) derivação parassintética, derivação prefixal, derivação sufixal.",
                    "C) composição por justaposição, derivação parassintética, derivação prefixal.",
                    "D) derivação prefixal, derivação prefixal e sufixal, derivação parassintética.",
                    "E) composição por aglutinação, derivação prefixal e sufixal, derivação imprópria.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) derivação prefixal, derivação prefixal e sufixal, derivação parassintética."
            },
            {
                id: 5,
                pergunta: 'Assinale a alternativa em que a palavra em destaque foi formada pelo processo de derivação regressiva.',
                tipo: "A-E",
                opcoes: [
                    "A) O interrogatório ocorreu de forma ININTERRUPTA.",
                    "B) O NÃO do delegado encerrou imediatamente a negociação.",
                    "C) A viatura permaneceu estacionada no PLANALTO central.",
                    "D) O GUARDA-CHUVA escuro foi esquecido na cena do crime.",
                    "E) O RESGATE dos reféns durou mais de quatro horas.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) O RESGATE dos reféns durou mais de quatro horas."
            },
            {
                id: 6,
                pergunta: 'Na oração "A viatura descaracterizada, UM FANTASMA NAS RUAS DO CENTRO, acompanhava o alvo silenciosamente", o termo entre vírgulas classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) Adjunto adverbial de modo.",
                    "B) Aposto explicativo.",
                    "C) Aposto comparativo.",
                    "D) Predicativo do sujeito.",
                    "E) Vocativo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Aposto comparativo."
            },
            {
                id: 7,
                pergunta: 'Assinale a alternativa em que a palavra em destaque pertence à classe dos advérbios.',
                tipo: "A-E",
                opcoes: [
                    "A) Havia BASTANTES indícios de fraude no processo licitatório.",
                    "B) A testemunha parecia MEIO nervosa durante a acareação.",
                    "C) O equipamento pericial tem um custo ALTO.",
                    "D) NENHUM suspeito compareceu à audiência de custódia.",
                    "E) Os peritos apresentaram PROVAS irrefutáveis ao promotor.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) A testemunha parecia MEIO nervosa durante a acareação."
            },
            {
                id: 8,
                pergunta: 'No período "O inspetor saiu COM o colega, mas agiu COM cautela e feriu-se COM o estilhaço", as ocorrências da preposição COM estabelecem, respectivamente, noções semânticas de:',
                tipo: "A-E",
                opcoes: [
                    "A) companhia, modo e instrumento.",
                    "B) instrumento, causa e companhia.",
                    "C) companhia, instrumento e meio.",
                    "D) modo, companhia e causa.",
                    "E) causa, modo e instrumento.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) companhia, modo e instrumento."
            },
            {
                id: 9,
                pergunta: 'Em "AQUELES peritos encontraram ALGO suspeito em NOSSA viatura", os termos em destaque classificam-se, morfologicamente e na ordem em que aparecem, como:',
                tipo: "A-E",
                opcoes: [
                    "A) pronome relativo, pronome indefinido e adjetivo pátrio.",
                    "B) pronome indefinido, pronome demonstrativo e pronome pessoal.",
                    "C) artigo definido, pronome substantivo e pronome demonstrativo.",
                    "D) pronome demonstrativo, advérbio de intensidade e pronome possessivo.",
                    "E) pronome demonstrativo, pronome indefinido e pronome possessivo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) pronome demonstrativo, pronome indefinido e pronome possessivo."
            },
            {
                id: 10,
                pergunta: 'Assinale a opção em que a oração apresenta sujeito indeterminado.',
                tipo: "A-E",
                opcoes: [
                    "A) Havia muitos policiais à paisana no entorno do estádio.",
                    "B) Faz dez anos do encerramento daquele inquérito policial.",
                    "C) Alugam-se salas comerciais próximas à delegacia regional.",
                    "D) Precisa-se de novos peritos criminais para o instituto de genética.",
                    "E) Choveu intensamente durante toda a operação na zona rural.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Precisa-se de novos peritos criminais para o instituto de genética."
            },
            {
                id: 11,
                pergunta: 'Assinale a alternativa cuja oração apresenta predicado verbo-nominal.',
                tipo: "A-E",
                opcoes: [
                    "A) Os investigadores permaneceram atentos durante toda a vigília.",
                    "B) O suspeito confessou o crime ao delegado na madrugada.",
                    "C) Os peritos chegaram exaustos à cena do crime.",
                    "D) A viatura policial estava estacionada na esquina da avenida.",
                    "E) O escrivão entregou o relatório final ao promotor de justiça.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Os peritos chegaram exaustos à cena do crime."
            },
            {
                id: 12,
                pergunta: 'Na oração "Faltaram aos candidatos daquela turma orientações precisas sobre o edital", o núcleo do sujeito é:',
                tipo: "A-E",
                opcoes: [
                    "A) orientações.",
                    "B) turma.",
                    "C) candidatos.",
                    "D) edital.",
                    "E) inexistente, pois o verbo faltar é impessoal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) orientações."
            },
            {
                id: 13,
                pergunta: 'Assinale a alternativa em que o termo em destaque exerce a função sintática de complemento nominal.',
                tipo: "A-E",
                opcoes: [
                    "A) O delegado desconfiou DAS DECLARAÇÕES DO SUSPEITO.",
                    "B) A população tem necessidade DE SEGURANÇA PÚBLICA.",
                    "C) O escrivão entregou os documentos AO MAGISTRADO.",
                    "D) O inspetor obedeceu ÀS ORDENS DO COMANDO.",
                    "E) A equipe tática precisava DE REFORÇO IMEDIATO.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) A população tem necessidade DE SEGURANÇA PÚBLICA."
            },
            {
                id: 14,
                pergunta: 'No período "As provas materiais, o perito recolheu-AS cuidadosamente no local isolado", o termo em destaque classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) sujeito simples.",
                    "B) objeto indireto.",
                    "C) aposto resumitivo.",
                    "D) complemento nominal.",
                    "E) objeto direto pleonástico.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) objeto direto pleonástico."
            },
            {
                id: 15,
                pergunta: 'Em "O laudo pericial foi elaborado PELOS TÉCNICOS DO INSTITUTO DE CRIMINALÍSTICA", a expressão destacada exerce a função de:',
                tipo: "A-E",
                opcoes: [
                    "A) adjunto adnominal.",
                    "B) objeto indireto.",
                    "C) adjunto adverbial de meio.",
                    "D) agente da passiva.",
                    "E) complemento nominal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) agente da passiva."
            },
            {
                id: 16,
                pergunta: 'Considerando a relação sintática estabelecida entre os termos da oração "A apreensão DE ARMAS ILEGAIS resultou da denúncia DO INFORMANTE", os termos em destaque classificam-se, respectivamente, como:',
                tipo: "A-E",
                opcoes: [
                    "A) complemento nominal e adjunto adnominal.",
                    "B) adjunto adnominal e complemento nominal.",
                    "C) adjunto adnominal e adjunto adnominal.",
                    "D) complemento nominal e complemento nominal.",
                    "E) aposto especificativo e adjunto adnominal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) complemento nominal e adjunto adnominal."
            },
            {
                id: 17,
                pergunta: 'Na oração "Apesar do mau tempo, os policiais patrulharam a rodovia COM CAUTELA", a expressão em destaque classifica-se como adjunto adverbial de:',
                tipo: "A-E",
                opcoes: [
                    "A) instrumento.",
                    "B) modo.",
                    "C) companhia.",
                    "D) causa.",
                    "E) concessão.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) modo."
            },
            {
                id: 18,
                pergunta: 'Assinale a opção em que o termo em destaque exerce a função sintática de aposto explicativo.',
                tipo: "A-E",
                opcoes: [
                    "A) SENHOR DELEGADO, o inquérito já foi devidamente autuado.",
                    "B) A cidade DE PETROLINA receberá novo efetivo policial neste semestre.",
                    "C) O perito criminal, PROFISSIONAL DE ALTA QUALIFICAÇÃO TÉCNICA, concluiu a análise.",
                    "D) Armas, munições e documentos, TUDO foi encaminhado à perícia.",
                    "E) O tenente e o cabo atuaram juntos; ESTE isolou a área, AQUELE ouviu as testemunhas.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) O perito criminal, PROFISSIONAL DE ALTA QUALIFICAÇÃO TÉCNICA, concluiu a análise."
            },
            {
                id: 19,
                pergunta: 'No período "O suspeito negou a autoria do crime, TODAVIA AS PROVAS MATERIAIS CONFIRMAM SUA PARTICIPAÇÃO", a oração em destaque classifica-se como coordenada sindética:',
                tipo: "A-E",
                opcoes: [
                    "A) conclusiva.",
                    "B) explicativa.",
                    "C) aditiva.",
                    "D) adversativa.",
                    "E) alternativa.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) adversativa."
            },
            {
                id: 20,
                pergunta: 'No período "O mandado judicial já havia sido expedido; os agentes, POIS, iniciaram imediatamente as diligências", a conjunção em destaque introduz uma oração coordenada sindética:',
                tipo: "A-E",
                opcoes: [
                    "A) conclusiva, equivalendo semanticamente a PORTANTO.",
                    "B) adversativa, podendo ser substituída por CONTUDO sem prejuízo gramatical.",
                    "C) explicativa, podendo ser substituída por PORQUANTO sem alteração de sentido.",
                    "D) causal, indicando o motivo pelo qual o mandado foi expedido.",
                    "E) aditiva, somando uma nova ação independente à anterior.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) conclusiva, equivalendo semanticamente a PORTANTO."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
