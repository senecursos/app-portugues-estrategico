<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-secondary { background-color: #475569; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar / Limpar Votação da Tela dos Alunos</button>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Proteção por senha simples de acesso
        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") { // <--- Altere sua senha de acesso aqui se desejar
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES (12 QUESTÕES CARREGADAS)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: "Assinale a alternativa em que a colocação pronominal atende rigorosamente ao padrão culto da língua.",
                tipo: "A-E",
                opcoes: [
                    "A) Não me disseram que a reunião havia sido cancelada ontem.",
                    "B) Me disseram que a reunião havia sido cancelada ontem.",
                    "C) Nunca disseram-me que a reunião havia sido cancelada ontem.",
                    "D) Disseram-me não que a reunião havia sido cancelada ontem.",
                    "E) Ninguém havia falado-me sobre o cancelamento da reunião ontem.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) Não me disseram que a reunião havia sido cancelada ontem."
            },
            {
                id: 2,
                pergunta: "A próclise é obrigatória na seguinte opção:",
                tipo: "A-E",
                opcoes: [
                    "A) Entregou os relatórios, posicionando-se contra o parecer final.",
                    "B) Em se tratando de negociações contratuais, a prudência é indispensável.",
                    "C) Os conselheiros manifestaram-se contrários à aprovação do orçamento.",
                    "D) Os documentos foram entregues, conforme disse-nos o diretor.",
                    "E) Poderia indicar-me o caminho correto para a auditório principal?",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Em se tratando de negociações contratuais, a prudência é indispensável."
            },
            {
                id: 3,
                pergunta: "Quanto à concordância verbal, assinale a opção inteiramente correta.",
                tipo: "A-E",
                opcoes: [
                    "A) Fazem três anos que o comitê de ética não realiza sessões extraordinárias.",
                    "B) Sobrou, no cofre central, apenas duas notas de valor elevado.",
                    "C) Haviam ocorrido graves divergências entre os membros da equipe técnica.",
                    "D) Tratam-se de processos extremamente complexos e sigilosos.",
                    "E) Fui eu que propôs a revisão das diretrizes operacionais do projeto.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Haviam ocorrido graves divergências entre os membros da equipe técnica."
            },
            {
                id: 4,
                pergunta: "Assinale a alternativa que apresenta a concordância em conformidade com a norma-padrão.",
                tipo: "A-E",
                opcoes: [
                    "A) Mais de um auditor contestaram os dados apresentados pelo relatório.",
                    "B) Grande parte dos funcionários optaram pelo plano de demissão voluntária.",
                    "C) Qual de nós realizaremos a apresentação dos resultados ao conselho?",
                    "D) Fui eu quem organizou a estrutura dos arquivos digitais da empresa.",
                    "E) Houveram equívocos graves na apuração dos índices trimestrais.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Fui eu quem organizou a estrutura dos arquivos digitais da empresa."
            },
            {
                id: 5,
                pergunta: "Na oração \"Aos alunos mais empenhados, o diretor entregou as medalhas de honra\", a função sintática do termo Aos alunos mais empenhados é:",
                tipo: "A-E",
                opcoes: [
                    "A) Objeto direto preposicionado",
                    "B) Objeto indireto",
                    "C) Complemento nominal",
                    "D) Adjunto adnominal",
                    "E) Sujeito paciente",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Objeto indireto"
            },
            {
                id: 6,
                pergunta: "Em \"Permaneceram calados durante toda a sessão os conselheiros regionais\", o termo os conselheiros regionais exerce a função sintática de:",
                tipo: "A-E",
                opcoes: [
                    "A) Sujeito",
                    "B) Objeto direto",
                    "C) Predicativo do sujeito",
                    "D) Agente da passiva",
                    "E) Adjunto adverbial de companhia",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) Sujeito"
            },
            {
                id: 7,
                pergunta: "Assinale a alternativa em que a oração destacada classifica-se como subordinada substantiva completiva nominal.",
                tipo: "A-E",
                opcoes: [
                    "A) É urgente que os diretores tomem uma decisão formal.",
                    "B) Ninguém duvidava de que o candidato seria eleito em primeiro turno.",
                    "C) Tínhamos plena certeza de que os recursos seriam liberados até sexta-feira.",
                    "D) O parecerista constatou que o orçamento apresentava inconsistências.",
                    "E) A exigência do conselho era que a ata fosse redigida imediatamente.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Tínhamos plena certeza de que os recursos seriam liberados até sexta-feira."
            },
            {
                id: 8,
                pergunta: "No período \"O regulamento interno proíbe que os funcionários utilizem os equipamentos sem autorização\", a oração destacada é subordinada:",
                tipo: "A-E",
                opcoes: [
                    "A) Substantiva subjetiva",
                    "B) Substantiva predicativa",
                    "C) Substantiva objetiva direta",
                    "D) Substantiva objetiva indireta",
                    "E) Adjetiva restritiva",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Substantiva objetiva direta"
            },
            {
                id: 9,
                pergunta: "No trecho \"O pesquisador submeteu o artigo à revista científica. O acadêmico, no entanto, precisou reescrever a introdução\", o termo destacado atua como mecanismo de coesão lexical por:",
                tipo: "A-E",
                opcoes: [
                    "A) Hiperonímia",
                    "B) Sinonímia",
                    "C) Antonímia",
                    "D) Repetição anafórica estrita",
                    "E) Metonímia",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Sinonímia"
            },
            {
                id: 10,
                pergunta: "Assinale a opção em que a substituição do termo sublinhado mantém a coesão por hiperonímia.",
                tipo: "A-E",
                opcoes: [
                    "A) O veículo colidiu no cruzamento. O carro sofreu danos graves na lataria.",
                    "B) O advogado apresentou a defesa. O causídico obteve parecer favorável.",
                    "C) A empresa contratou novos auditores. A instituição busca expandir suas atividades.",
                    "D) O cão latia no quintal. O animal estava assustado com o barulho dos fogos.",
                    "E) O médico atendeu o paciente. O especialista recomendou repouso absoluto.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) O cão latia no quintal. O animal estava assustado com o barulho dos fogos."
            },
            {
                id: 11,
                pergunta: "Assinale a alternativa em que o verbo destacado está corretamente flexionado no Futuro do Subjuntivo.",
                tipo: "A-E",
                opcoes: [
                    "A) Se o diretor manter a decisão, haverá insatisfação na equipe.",
                    "B) Quando nós pormos os documentos na pasta, o processo estará concluído.",
                    "C) Caso a testemunha depor novamente, o juiz encerrará a instrução.",
                    "D) Se você vir ao escritório amanhã, entregarei os relatórios assinados.",
                    "E) Se ele prover o cargo com dedicação, alcançará excelentes resultados.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) Se ele prover o cargo com dedicação, alcançará excelentes resultados."
            },
            {
                id: 12,
                pergunta: "O verbo reaver está flexionado de acordo com a norma-padrão em:",
                tipo: "A-E",
                opcoes: [
                    "A) O advogado reaveu os documentos anexados ao processo antigo.",
                    "B) Se nós reavermos o capital investido, faremos novos aportes.",
                    "C) Os acionistas reouveram as perdas financeiras após a decisão judicial.",
                    "D) Espero que a empresa reaveja a posse do imóvel comercial.",
                    "E) Quando eles reaverem o controle das ações, a reunião será convocada.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Os acionistas reouveram as perdas financeiras após a decisão judicial."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Votos: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (contagem[v.opcao] !== undefined) {
                        contagem[v.opcao]++;
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = op === questao.gabarito;
                        const ehChute = op.includes("Chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
