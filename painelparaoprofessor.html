<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (21 QUESTÕES CERTO/ERRADO)
        // =========================================================================
        const questoes = [
            { id: 1, pergunta: 'No período "Venderam-<b>se</b> os imóveis comerciais do centro da cidade", a partícula "se" atua como partícula apassivadora, sendo "os imóveis comerciais do centro da cidade" o sujeito paciente da oração.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 2, pergunta: 'Na oração "Tratam-<b>se</b> de assuntos sigilosos que exigem a atenção da diretoria", a flexão do verbo no plural justifica-se pela necessidade de concordância com o sujeito "assuntos sigilosos".', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 3, pergunta: 'Em "O jovem candidato preparou-<b>se</b> adequadamente para a sabatina do conselho", a palavra "se" exerce a função sintática de índice de indeterminação do sujeito.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 4, pergunta: 'No trecho "Alugou-<b>se</b> os galpões industriais no início do semestre", a concordância praticada atende rigorosamente às regras da norma-padrão da Língua Portuguesa.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 5, pergunta: 'Na frase "Necessita-<b>se</b> de novos pareceres técnicos para a instrução do processo", a partícula "se" funciona como índice de indeterminação do sujeito, razão pela qual o verbo permanece obrigatoriamente no singular.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 6, pergunta: 'Em "Os advogados cumprimentaram-<b>se</b> friamente antes do início da audiência", o pronome "se" expressa uma ação reflexiva recíproca entre os sujeitos da oração.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 7, pergunta: 'No segmento "Vive-<b>se</b> com mais tranquilidade nas cidades de menor porte", a palavra "se" atua como partícula apassivadora, estando o sujeito oculto na frase.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 8, pergunta: 'Em "Fixaram-<b>se</b> os cartazes informativos nos murais do edifício sede", o termo "os cartazes informativos" exerce a função sintática de sujeito paciente na voz passiva sintética.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 9, pergunta: 'No trecho "O acusado declarou-<b>se</b> inocente durante o interrogatório judicial", o elemento "se" desempenha a função de pronome reflexivo.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 10, pergunta: 'Na frase "Divulgou-<b>se</b> ontem as notas definitivas da prova discursiva", a concordância verbal efetuada no singular está correta, pois a partícula "se" indetermina o sujeito da oração.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 11, pergunta: 'Em "Aspira-<b>se</b> a cargos públicos de grande relevância no cenário nacional", o termo "a cargos públicos" funciona como objeto indireto de um verbo acompanhado por índice de indeterminação do sujeito.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 12, pergunta: 'No trecho "As testemunhas contradisseram-<b>se</b> nos depoimentos prestados à autoridade", a partícula "se" classifica-se como partícula apassivadora, já que a ação verbal é sofrida pelo sujeito.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 13, pergunta: 'Na oração "Precisa-<b>se</b> de fiscais de contrato mais atentos às cláusulas operacionais", o termo "fiscais de contrato" exerce a função de sujeito simples da oração.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 14, pergunta: 'Em "Aprovou-<b>se</b> a nova lei de diretrizes orçamentárias na sessão de ontem", a oração encontra-se na voz passiva sintética, sendo o verbo transitivo direto acompanhado de partícula apassivadora.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 15, pergunta: 'No período "O motorista feriu-<b>se</b> gravemente no acidente ocorrido na rodovia", a partícula "se" indica que o sujeito pratica e sofre a ação verbal, configurando a voz reflexiva.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 16, pergunta: 'Na frase "Proíbem-<b>se</b> a entrada e a permanência de pessoas não autorizadas na sala de controle", a concordância verbal do verbo no plural é obrigatória por se tratar de sujeito paciente composto antecedente ou posposto pleno.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 17, pergunta: 'Em "Acredita-<b>se</b> em dias melhores para a economia do país no próximo trimestre", a palavra "se" atua como índice de indeterminação do sujeito, mantendo o verbo obrigatoriamente na terceira pessoa do singular.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" },
            { id: 18, pergunta: 'No segmento "Os delegados reuniram-<b>se</b> com o corregedor para alinhar as diretrizes de investigação", a palavra "se" funciona como índice de indeterminação do sujeito.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 19, pergunta: 'Na oração "Proferiu-<b>se</b> decisões conflitantes durante o julgamento dos recursos", a forma verbal no singular atende à norma-padrão, visto que a partícula "se" torna o sujeito indeterminado.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 20, pergunta: 'No trecho "Recorrem-<b>se</b> a estratégias jurídicas ousadas quando os prazos estão escassos", a flexão do verbo no plural está em conformidade com a norma-padrão, pois concorda com "estratégias jurídicas".', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Errado" },
            { id: 21, pergunta: 'Em "O conselheiro vestiu-<b>se</b> formalmente para a solenidade de posse", a partícula "se" atua como pronome reflexivo, funcionando sintaticamente como objeto direto.', tipo: "Certo/Errado", opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"], gabarito: "Certo" }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
