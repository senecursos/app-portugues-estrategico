<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // NOVO BANCO DE QUESTÕES (18 QUESTÕES - CERTO / ERRADO)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'No trecho "A frugalidade do gestor ao alocar os recursos evitou que a instituição entrasse em colapso financeiro", a palavra em destaque preserva a coesão e o sentido original do texto caso substitua o vocábulo "parsimônia".',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 2,
                pergunta: 'Considere a frase: "O cientista apresentou uma hipótese plausível, contudo os dados demonstraram a ineficácia do método utilizado." Os vocábulos inverossímil e eficácia funcionam como antônimos diretos, respectivamente, das palavras "plausível" e "ineficácia".',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 3,
                pergunta: 'A oração "Trata-se de medidas urgentes, visto que foram dados bastantes oportunidades aos envolvidos" atende plenamente às regras de concordância verbal e nominal estabelecidas pela norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 4,
                pergunta: 'No enunciado "A maioria dos servidores públicos protestaram contra o projeto de lei", a concordância verbal efetuada no plural é considerada gramaticalmente incorreta segundo a norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 5,
                pergunta: 'Na frase "A jovem agiu bastante calmamente durante a reunião, demonstrando bastante conhecimento do assunto", a palavra em destaque classifica-se, sequencialmente, como advérbio e como pronome adjetivo (indefinido).',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 6,
                pergunta: "Os vocábulos pesquisa, beneficente, privilégio e pretensão encontram-se todos grafados corretamente segundo a ortografia oficial vigente.",
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 7,
                pergunta: 'Na frase "Quando você vir o relatório financeiro, entenderá os investimentos", a forma verbal em destaque encontra-se corretamente flexionada no futuro do subjuntivo do verbo ver.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 8,
                pergunta: 'A construção "Em se tratando de urgência, a equipe médica agiu imediatamente" atende estritamente às regras de colocação pronominal da norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 9,
                pergunta: 'No período "Ninguém orientou-me sobre o preenchimento do formulário", a colocação do pronome oblíquo átono em posição enclítica está em conformidade com as regras gramaticais da norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 10,
                pergunta: 'Na oração "O diretor da empresa considerou a proposta dos acionistas vantajosa", o termo em destaque exerce a função sintática de predicativo do objeto.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 11,
                pergunta: 'Em "As opiniões do especialista eram favoráveis aos alunos do colégio", o termo em destaque funciona sintaticamente como objeto indireto da oração.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 12,
                pergunta: 'No enunciado "O professor entregou as notas aos alunos entusiasmado", o predicado da oração classifica-se como verbo-nominal.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 13,
                pergunta: 'Na frase "A tempestade assustou os moradores daquela vila pacata", o predicado possui classificação nominal.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 14,
                pergunta: "As palavras girassol, embora e infelizmente são formadas, respectivamente, pelos processos de composição por justaposição, composição por aglutinação e derivação prefixal e sufixal.",
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 15,
                pergunta: "Um texto marcado pela presença de verbos no imperativo ou no infinitivo, cujo intuito é instruir e guiar o leitor sobre um procedimento, pertence predominantemente ao tipo textual injuntivo.",
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 16,
                pergunta: "A crônica caracteriza-se por ser uma narrativa curta, frequentemente inspirada em fatos do cotidiano, podendo apresentar tom reflexivo, poético ou bem-humorado.",
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 17,
                pergunta: "A divisão silábica da palavra sub-li-nhar está em total conformidade com as normas ortográficas vigentes.",
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 18,
                pergunta: 'O emprego do sinal indicativo de crase e a flexão do artigo estão corretos na frase: "O palestrante dirigiu-se à comunidade acadêmica e prestou homenagens às professoras, ficando à espera do resultado das homenagens."',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
