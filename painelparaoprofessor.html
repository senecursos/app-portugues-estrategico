<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (20 QUESTÕES: SUJEITO E PREDICADO)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'Na oração "Necessita-se de peritos criminais com urgência naquele departamento", a correta classificação do sujeito é:',
                tipo: "A-E",
                opcoes: ["A) Sujeito oculto.", "B) Sujeito simples.", "C) Sujeito indeterminado.", "D) Sujeito inexistente.", "E) Sujeito composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Sujeito indeterminado."
            },
            {
                id: 2,
                pergunta: 'No período "A nova legislação tributária entrou em vigor na manhã de hoje", o sujeito classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito inexistente.", "B) Sujeito composto.", "C) Sujeito oculto.", "D) Sujeito simples.", "E) Sujeito indeterminado.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Sujeito simples."
            },
            {
                id: 3,
                pergunta: 'Analise a frase "Havia muitas pendências processuais no arquivo morto da secretaria". O sujeito dessa oração deve ser classificado como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito composto.", "B) Sujeito inexistente.", "C) Sujeito indeterminado.", "D) Sujeito simples.", "E) Sujeito oculto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Sujeito inexistente."
            },
            {
                id: 4,
                pergunta: 'No trecho "Entregaremos os formulários preenchidos ao setor de protocolo amanhã", a estrutura sintática configura um:',
                tipo: "A-E",
                opcoes: ["A) Sujeito indeterminado.", "B) Sujeito simples.", "C) Sujeito oculto.", "D) Sujeito composto.", "E) Sujeito inexistente.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Sujeito oculto."
            },
            {
                id: 5,
                pergunta: 'Na oração "Prefeitos e governadores debateram exaustivamente a distribuição das verbas federais", o sujeito é classificado gramaticalmente como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito composto.", "B) Sujeito inexistente.", "C) Sujeito simples.", "D) Sujeito indeterminado.", "E) Sujeito oculto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Sujeito composto."
            },
            {
                id: 6,
                pergunta: 'Em relação à frase "Invadiram o sistema de segurança da câmara de vereadores no fim de semana", o sujeito classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito simples.", "B) Sujeito oculto.", "C) Sujeito inexistente.", "D) Sujeito composto.", "E) Sujeito indeterminado.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Sujeito indeterminado."
            },
            {
                id: 7,
                pergunta: 'No período "Trovejou demasiadamente durante a madrugada na região serrana", o sujeito da oração é classificado como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito inexistente.", "B) Sujeito indeterminado.", "C) Sujeito composto.", "D) Sujeito oculto.", "E) Sujeito simples.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Sujeito inexistente."
            },
            {
                id: 8,
                pergunta: 'Na frase "Apenas um dos vereadores absteve-se durante a polêmica votação nominal", o sujeito classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito oculto.", "B) Sujeito simples.", "C) Sujeito composto.", "D) Sujeito inexistente.", "E) Sujeito indeterminado.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Sujeito simples."
            },
            {
                id: 9,
                pergunta: 'No trecho "Reconheceste o teu equívoco durante a acareação judicial?", a correta classificação do sujeito é:',
                tipo: "A-E",
                opcoes: ["A) Sujeito composto.", "B) Sujeito indeterminado.", "C) Sujeito simples.", "D) Sujeito inexistente.", "E) Sujeito oculto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Sujeito oculto."
            },
            {
                id: 10,
                pergunta: 'Na oração "A falta de planejamento e o excesso de gastos prejudicaram a gestão municipal", o sujeito deve ser classificado como:',
                tipo: "A-E",
                opcoes: ["A) Sujeito inexistente.", "B) Sujeito composto.", "C) Sujeito oculto.", "D) Sujeito indeterminado.", "E) Sujeito simples.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Sujeito composto."
            },
            {
                id: 11,
                pergunta: 'Na oração "Os auditores deixaram o prédio da controladoria exaustos", o predicado classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Predicado verbal.", "B) Predicado nominal.", "C) Predicado simples.", "D) Predicado verbo-nominal.", "E) Predicado composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Predicado verbo-nominal."
            },
            {
                id: 12,
                pergunta: 'No período "O clima no plenário permaneceu tenso durante a votação", a correta classificação do predicado é:',
                tipo: "A-E",
                opcoes: ["A) Predicado nominal.", "B) Predicado verbo-nominal.", "C) Predicado simples.", "D) Predicado verbal.", "E) Predicado composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Predicado nominal."
            },
            {
                id: 13,
                pergunta: 'Analise a frase "A procuradoria arquivou os processos criminais na semana passada". O predicado dessa oração deve ser classificado como:',
                tipo: "A-E",
                opcoes: ["A) Predicado verbo-nominal.", "B) Predicado composto.", "C) Predicado verbal.", "D) Predicado nominal.", "E) Predicado adverbial.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Predicado verbal."
            },
            {
                id: 14,
                pergunta: 'No trecho "O conselho de administração elegeu o servidor público presidente da autarquia", a estrutura sintática configura um:',
                tipo: "A-E",
                opcoes: ["A) Predicado verbal.", "B) Predicado nominal.", "C) Predicado verbo-nominal.", "D) Predicado simples.", "E) Predicado composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Predicado verbo-nominal."
            },
            {
                id: 15,
                pergunta: 'Na oração "Os servidores estaduais reivindicaram melhores condições estruturais ao governador", o predicado é classificado gramaticalmente como:',
                tipo: "A-E",
                opcoes: ["A) Predicado simples.", "B) Predicado nominal.", "C) Predicado verbo-nominal.", "D) Predicado composto.", "E) Predicado verbal.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "E) Predicado verbal."
            },
            {
                id: 16,
                pergunta: 'Em relação à frase "A decisão da mesa diretora pareceu precipitada aos olhos atônitos da imprensa", o predicado classifica-se como:',
                tipo: "A-E",
                opcoes: ["A) Predicado nominal.", "B) Predicado verbal.", "C) Predicado composto.", "D) Predicado verbo-nominal.", "E) Predicado simples.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "A) Predicado nominal."
            },
            {
                id: 17,
                pergunta: 'No período "As testemunhas de defesa depuseram bastante nervosas na audiência de instrução", o predicado da oração é classificado como:',
                tipo: "A-E",
                opcoes: ["A) Predicado verbal.", "B) Predicado nominal.", "C) Predicado composto.", "D) Predicado verbo-nominal.", "E) Predicado adverbial.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Predicado verbo-nominal."
            },
            {
                id: 18,
                pergunta: 'Na frase "O prefeito municipal considerou o projeto orçamentário inviável para o próximo exercício", o predicado classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: ["A) Predicado nominal.", "B) Predicado verbo-nominal.", "C) Predicado verbal.", "D) Predicado simples.", "E) Predicado adverbial.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "B) Predicado verbo-nominal."
            },
            {
                id: 19,
                pergunta: 'No trecho "A nova sede da secretaria de fazenda continua interditada para reformas urgentes", a correta classificação do predicado é:',
                tipo: "A-E",
                opcoes: ["A) Predicado composto.", "B) Predicado verbo-nominal.", "C) Predicado nominal.", "D) Predicado verbal.", "E) Predicado simples.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "C) Predicado nominal."
            },
            {
                id: 20,
                pergunta: 'Na oração "Os fiscais alfandegários apreenderam diversas mercadorias irregulares no porto seco", o predicado deve ser classificado como:',
                tipo: "A-E",
                opcoes: ["A) Predicado verbo-nominal.", "B) Predicado simples.", "C) Predicado nominal.", "D) Predicado verbal.", "E) Predicado composto.", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "D) Predicado verbal."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
