<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // NOVO BANCO DE QUESTÕES (20 QUESTÕES - CERTO / ERRADO)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'No período "Jamais informaram-me sobre as alterações no cronograma da auditoria", a colocação do pronome oblíquo átono atende rigorosamente às regras da norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 2,
                pergunta: 'O emprego do sinal indicativo de crase está incorreto no trecho "As exigências do novo edital referem-se àquela norma publicada no mês passado".',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 3,
                pergunta: 'Em "A maioria dos servidores públicos protestaram contra o projeto de lei orçamentária", a concordância do verbo flexcionado no plural atende à norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 4,
                pergunta: 'Em "Durante a sessão plenária de ontem, os parlamentares aprovaram o texto base da reforma", a vírgula empregada após o adjunto adverbial de tempo é facultativa, dada a brevidade da locução.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 5,
                pergunta: 'Na oração "Aos pareceres jurídicos mais complexos, o relator não lhes deu a devida atenção", a próclise do pronome oblíquo é de emprego obrigatório.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 6,
                pergunta: 'Na frase "Alugou-se os galpões industriais da empresa antes da decretação de falência", a concordância do verbo no singular está em conformidade com as exigências da norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 7,
                pergunta: 'Na frase "O candidato declarou à imprensa que responderia à todas as perguntas da bancada", o sinal indicativo de crase foi empregado em estrita observância à norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 8,
                pergunta: 'No segmento "Os auditores examinaram, minuciosamente, os relatórios financeiros", o isolamento do advérbio de modo por vírgulas é considerado facultativo pela norma-padrão.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 9,
                pergunta: 'No enunciado "Qual de nós assumiremos a liderança das negociações com os representantes sindicais?", a concordância verbal efetuada na primeira pessoa do plural é correta.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 10,
                pergunta: 'Em "Dir-se-ia que a decisão foi tomada de forma precipitada pela junta médica", o emprego da mesóclise é opção facultativa do redator, sendo igualmente correta a forma "Se diria".',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 11,
                pergunta: 'Em "O assessor comunicou o fato à sua secretária sem demonstrar preocupação", o uso do sinal indicativo de crase é de caráter facultativo.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 12,
                pergunta: 'Na oração "Apenas 1% dos parlamentares votou contra a emenda constitucional no plenário", o verbo no singular está gramaticalmente incorreto, devendo flexcionar-se obrigatoriamente no plural.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 13,
                pergunta: 'Na frase "A equipe da noite revisou a minuta contratual; a da manhã, os anexos financeiros", a vírgula empregada na segunda oração justifica-se pela elipse do verbo anteriormente expresso.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 14,
                pergunta: 'No trecho "O supervisor chamou os colaboradores e orientou-nos sobre os novos procedimentos de segurança", a posição enclítica do pronome oblíquo observa as normas gramaticais.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            },
            {
                id: 15,
                pergunta: 'No enunciado "O parecerista não fez menção à esta cláusula contratual durante a sessão", o emprego da crase é obrigatorio diante do pronome demonstrativo.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 16,
                pergunta: 'Em "A corrupção, o nepotismo e a ineficiência, nada abalavam a convicção do jovem auditor", a flexão do verbo no plural justifica-se pela presença do sujeito composto antecedente.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 17,
                pergunta: 'No trecho "Senhor Presidente solicitamos a palavra para responder às acusações da bancada opositora", a ausência de vírgula após o termo inicial mantém a plena correção gramatical do texto.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 18,
                pergunta: 'No período "Precisa-se de técnicos especializados na manutenção dos equipamentos de informática", o verbo deve flexcionar-se no plural para concordar com o termo "técnicos especializados".',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 19,
                pergunta: 'Em "Houveram casos complexos durante a instrução do processo administrativo sanitário", o verbo está flexcionado corretamente no plural por concordar com o seu sujeito.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Errado"
            },
            {
                id: 20,
                pergunta: 'Na oração "O magistrado mandou os peritos assinarem o laudo cautelar imediatamente", a flexão de infinitivo no plural atende perfeitamente à norma-padrão da Língua Portuguesa.',
                tipo: "Certo / Errado",
                opcoes: ["Certo", "Errado", "🤷🏽‍♂️ Chutei (não tenho certeza.)"],
                gabarito: "Certo"
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
