<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES (10 QUESTÕES: TERMOS ACESSÓRIOS E APOSTOS)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'Assinale a alternativa em que a expressão destacada exerce a função sintática de adjunto adnominal, e não de complemento nominal.',
                tipo: "A-E",
                opcoes: [
                    "A) O combate AO CRIME ORGANIZADO é prioridade.",
                    "B) A leitura DO MANDADO foi feita pelo escrivão.",
                    "C) O depoimento DA VÍTIMA esclareceu o caso.",
                    "D) A apreensão DE ENTORPECENTES bateu recorde.",
                    "E) A condenação DO RÉU encerrou o processo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) O depoimento DA VÍTIMA esclareceu o caso."
            },
            {
                id: 2,
                pergunta: 'Considerando as estruturas sintáticas das orações "O sargento capturou o suspeito perigoso" e "A sociedade julgou o suspeito perigoso", assinale a opção correta quanto à classificação do termo PERIGOSO em cada uma delas, respectivamente.',
                tipo: "A-E",
                opcoes: [
                    "A) Adjunto adnominal e adjunto adnominal.",
                    "B) Predicativo do objeto e predicativo do objeto.",
                    "C) Adjunto adnominal e predicativo do objeto.",
                    "D) Predicativo do objeto e adjunto adnominal.",
                    "E) Predicativo do sujeito e adjunto adnominal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Adjunto adnominal e predicativo do objeto."
            },
            {
                id: 3,
                pergunta: 'Em "A cidade DE BARBALHA sediará o novo curso de formação", o termo em destaque classifica-se sintaticamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) Adjunto adnominal.",
                    "B) Complemento nominal.",
                    "C) Aposto especificativo.",
                    "D) Adjunto adverbial de lugar.",
                    "E) Aposto explicativo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Aposto especificativo."
            },
            {
                id: 4,
                pergunta: 'No trecho "Armas, munições, radiocomunicadores e coletes balísticos, TUDO foi apreendido durante a operação", o pronome destacado exerce a função sintática de:',
                tipo: "A-E",
                opcoes: [
                    "A) Sujeito composto.",
                    "B) Aposto resumitivo (ou recapitulativo).",
                    "C) Objeto direto.",
                    "D) Adjunto adnominal.",
                    "E) Predicativo do sujeito.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Aposto resumitivo (ou recapitulativo)."
            },
            {
                id: 5,
                pergunta: 'Assinale a alternativa em que o adjunto adverbial destacado exprime circunstância de causa.',
                tipo: "A-E",
                opcoes: [
                    "A) O réu permaneceu calado POR ORIENTAÇÃO DO ADVOGADO.",
                    "B) O sistema do tribunal foi atualizado PARA MAIOR SEGURANÇA.",
                    "C) A barricada foi erguida COM ENTULHO E PNEUS VELHOS.",
                    "D) A viatura descaracterizada acompanhou o alvo SILENCIOSAMENTE.",
                    "E) O mandado de busca e apreensão expirou ONTEM À NOITE.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) O réu permaneceu calado POR ORIENTAÇÃO DO ADVOGADO."
            },
            {
                id: 6,
                pergunta: 'Na oração "A viatura descaracterizada, UM FANTASMA NAS RUAS DO CENTRO, acompanhava o alvo silenciosamente", o termo entre vírgulas classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) Adjunto adverbial de modo.",
                    "B) Aposto explicativo.",
                    "C) Predicativo do sujeito.",
                    "D) Aposto comparativo.",
                    "E) Vocativo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Aposto comparativo."
            },
            {
                id: 7,
                pergunta: 'Assinale a alternativa em que o termo destacado funciona sintaticamente como vocativo.',
                tipo: "A-E",
                opcoes: [
                    "A) O DELEGADO, João, assumiu o plantão noturno.",
                    "B) A equipe tática localizou O SUSPEITO, João.",
                    "C) JOÃO, o delegado assumiu o plantão noturno.",
                    "D) O plantão noturno foi assumido POR JOÃO.",
                    "E) O DELEGADO JOÃO assumiu o plantão noturno.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) JOÃO, o delegado assumiu o plantão noturno."
            },
            {
                id: 8,
                pergunta: 'No período "O tenente e o sargento apresentaram o relatório; ESTE detalhou as apreensões, AQUELE justificou as prisões", os termos destacados atuam sintaticamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) Sujeitos simples e pronomes demonstrativos.",
                    "B) Apostos distributivos.",
                    "C) Adjuntos adnominais.",
                    "D) Apostos enumerativos.",
                    "E) Predicativos do sujeito.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Apostos distributivos."
            },
            {
                id: 9,
                pergunta: 'Na oração "O sistema do fórum falhou POR SOBRECARGA", a expressão destacada tem o mesmo valor semântico e sintático do termo sublinhado em:',
                tipo: "A-E",
                opcoes: [
                    "A) O perito cortou a cerca COM UM ALICATE.",
                    "B) O foragido viajou DE TREM para despistar a polícia.",
                    "C) O comércio fechou POR MEDO da facção.",
                    "D) O projeto foi aprovado POR UNANIMIDADE.",
                    "E) O detetive caminhou POR DUAS HORAS.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) O comércio fechou POR MEDO da facção."
            },
            {
                id: 10,
                pergunta: 'Assinale a opção que apresenta um adjunto adnominal, um aposto explicativo e um adjunto adverbial, nessa ordem.',
                tipo: "A-E",
                opcoes: [
                    "A) O novo investigador, profissional dedicado, trabalhou muito.",
                    "B) O investigador de polícia agiu com rapidez, um verdadeiro herói.",
                    "C) Trabalhou muito o investigador, profissional dedicado.",
                    "D) O profissional dedicado, um verdadeiro herói, agiu de madrugada.",
                    "E) Rapidamente, o novo investigador trabalhou com dedicação.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) O novo investigador, profissional dedicado, trabalhou muito."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
