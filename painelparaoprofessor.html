<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (16 QUESTÕES)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'No período "A lealdade dos servidores foi testada durante a crise institucional", o vocábulo "lealdade" classifica-se morfologicamente como substantivo:',
                tipo: "A-E",
                opcoes: [
                    "A) Comum, abstrato, simples e primitivo.",
                    "B) Comum, concreto, simples e derivado.",
                    "C) Comum, abstrato, simples e derivado.",
                    "D) Próprio, abstrato, composto e derivado.",
                    "E) Comum, abstrato, composto e primitivo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Comum, abstrato, simples e derivado."
            },
            {
                id: 2,
                pergunta: 'Na oração "A extração de granito na pedreira municipal foi suspensa temporariamente", a palavra "pedreira" é um substantivo cuja classificação exata é:',
                tipo: "A-E",
                opcoes: [
                    "A) Comum, concreto, simples e primitivo.",
                    "B) Comum, abstrato, simples e derivado.",
                    "C) Próprio, concreto, simples e primitivo.",
                    "D) Comum, concreto, composto e derivado.",
                    "E) Comum, concreto, simples e derivado.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) Comum, concreto, simples e derivado."
            },
            {
                id: 3,
                pergunta: 'No trecho "O gestor não conseguiu conter a ira ao ler o relatório fraudulento da autarquia", o substantivo "ira" deve ser classificado como:',
                tipo: "A-E",
                opcoes: [
                    "A) Comum, abstrato, simples e primitivo.",
                    "B) Comum, abstrato, simples e derivado.",
                    "C) Comum, concreto, simples e primitivo.",
                    "D) Próprio, abstrato, simples e derivado.",
                    "E) Comum, abstrato, composto e primitivo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) Comum, abstrato, simples e primitivo."
            },
            {
                id: 4,
                pergunta: 'Na frase "Brasília apresenta uma configuração arquitetônica singular no cenário mundial", o termo "Brasília" classifica-se morfologicamente como substantivo:',
                tipo: "A-E",
                opcoes: [
                    "A) Próprio, abstrato, simples e primitivo.",
                    "B) Próprio, concreto, simples e derivado.",
                    "C) Comum, concreto, simples e derivado.",
                    "D) Próprio, concreto, composto e primitivo.",
                    "E) Próprio, concreto, simples e primitivo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Próprio, concreto, simples e derivado."
            },
            {
                id: 5,
                pergunta: 'No período "A operação financeira revelou-se extremamente lucrativa para os cofres públicos", a palavra "lucrativa" classifica-se como um adjetivo:',
                tipo: "A-E",
                opcoes: [
                    "A) Simples e primitivo.",
                    "B) Composto e primitivo.",
                    "C) Simples e derivado.",
                    "D) Composto e derivado.",
                    "E) Pátrio e derivado.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Simples e derivado."
            },
            {
                id: 6,
                pergunta: 'Na oração "O conselho fiscal considerou o prazo justo para a apresentação das defesas", o vocábulo "justo" é classificado morfologicamente como adjetivo:',
                tipo: "A-E",
                opcoes: [
                    "A) Simples e derivado.",
                    "B) Composto e derivado.",
                    "C) Composto e primitivo.",
                    "D) Simples e primitivo.",
                    "E) Pátrio e primitivo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Simples e primitivo."
            },
            {
                id: 7,
                pergunta: 'No trecho "O acordo político-econômico beneficiou as exportações no último trimestre", o adjetivo "político-econômico" deve ser classificado como:',
                tipo: "A-E",
                opcoes: [
                    "A) Simples e derivado.",
                    "B) Composto e derivado.",
                    "C) Composto e primitivo.",
                    "D) Simples e primitivo.",
                    "E) Uniforme e composto.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Composto e derivado."
            },
            {
                id: 8,
                pergunta: 'Na frase "A atitude do conselheiro durante a votação foi considerada infantil pelos presentes", a palavra "infantil" atua como adjetivo:',
                tipo: "A-E",
                opcoes: [
                    "A) Simples e primitivo.",
                    "B) Composto e derivado.",
                    "C) Composto e primitivo.",
                    "D) Simples e derivado.",
                    "E) Restritivo e primitivo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Simples e derivado."
            },
            {
                id: 9,
                pergunta: 'No período "Nenhum candidato conseguiu atingir a pontuação máxima exigida pelo edital", o vocábulo "Nenhum" pertence à classe dos:',
                tipo: "A-E",
                opcoes: [
                    "A) Pronomes relativos.",
                    "B) Pronomes demonstrativos.",
                    "C) Pronomes possessivos.",
                    "D) Pronomes pessoais.",
                    "E) Pronomes indefinidos.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) Pronomes indefinidos."
            },
            {
                id: 10,
                pergunta: 'Na oração "O documento que o relator apresentou continha omissões gravíssimas", a palavra "que" classifica-se morfologicamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) Pronome relativo.",
                    "B) Pronome interrogativo.",
                    "C) Pronome indefinido.",
                    "D) Pronome demonstrativo.",
                    "E) Pronome pessoal oblíquo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) Pronome relativo."
            },
            {
                id: 11,
                pergunta: 'No trecho "Este ofício deve ser encaminhado ao setor de controladoria imediatamente", o termo "Este" exerce a função de:',
                tipo: "A-E",
                opcoes: [
                    "A) Pronome indefinido.",
                    "B) Pronome demonstrativo.",
                    "C) Pronome relativo.",
                    "D) Pronome possessivo.",
                    "E) Pronome interrogativo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Pronome demonstrativo."
            },
            {
                id: 12,
                pergunta: 'Na frase "A comissão investigadora convocou-o para prestar os devidos esclarecimentos", a palavra "o" anexada ao verbo classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) Artigo definido.",
                    "B) Pronome demonstrativo.",
                    "C) Pronome pessoal oblíquo.",
                    "D) Pronome relativo.",
                    "E) Pronome de tratamento.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Pronome pessoal oblíquo."
            },
            {
                id: 13,
                pergunta: 'No período "O processo foi mantido sob sigilo absoluto por determinação do tribunal", a palavra "sob" classifica-se morfologicamente como:',
                tipo: "A-E",
                opcoes: [
                    "A) Advérbio de modo.",
                    "B) Interjeição.",
                    "C) Conjunção integrante.",
                    "D) Preposição.",
                    "E) Artigo definido.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) Preposição."
            },
            {
                id: 14,
                pergunta: 'Na oração "Os recursos da autarquia foram bastante reduzidos no último exercício", o vocábulo "bastante" atua gramaticalmente como:',
                tipo: "A-E",
                opcoes: [
                    "A) Adjetivo.",
                    "B) Preposição.",
                    "C) Pronome indefinido.",
                    "D) Interjeição.",
                    "E) Advérbio.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) Advérbio."
            },
            {
                id: 15,
                pergunta: 'No trecho "Céus! Não previmos essa drástica queda nas ações da companhia", a expressão "Céus!" deve ser classificada como:',
                tipo: "A-E",
                opcoes: [
                    "A) Substantivo abstrato.",
                    "B) Advérbio de tempo.",
                    "C) Interjeição.",
                    "D) Preposição.",
                    "E) Pronome de tratamento.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Interjeição."
            },
            {
                id: 16,
                pergunta: 'Na frase "A decisão final foi proferida após o encerramento do expediente", a palavra "após" pertence à classe das:',
                tipo: "A-E",
                opcoes: [
                    "A) Conjunções subordinativas.",
                    "B) Preposições.",
                    "C) Interjeições.",
                    "D) Variáveis nominais.",
                    "E) Locuções adverbiais.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) Preposições."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
