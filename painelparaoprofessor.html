<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor | Controle de Votação</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #1e293b; padding-bottom: 20px; }
        h1 { color: #ffffff; font-size: 1.8rem; }
        p { color: #94a3b8; font-size: 0.95rem; }

        .card { background-color: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-weight: 700; font-size: 1.1rem; color: #38bdf8; }

        .btn { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-success { background-color: #16a34a; color: #fff; }
        .btn-danger { background-color: #dc2626; color: #fff; }
        .btn-warning { background-color: #d97706; color: #fff; }
        .btn:hover { opacity: 0.85; }

        .barra-progresso-bg { background-color: #0f172a; border-radius: 8px; height: 35px; width: 100%; margin: 8px 0 15px 0; overflow: hidden; position: relative; border: 1px solid #334155; }
        .barra-progresso-fill { background-color: #2563eb; height: 100%; transition: width 0.4s ease; }
        .barra-texto { position: absolute; top: 0; left: 12px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 0.9rem; color: #fff; text-shadow: 1px 1px 2px #000; }

        .estatisticas-gerais { font-size: 1.1rem; font-weight: 700; color: #f8fafc; margin-top: 15px; text-align: right; }
        
        .botoes-topo { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Painel do Professor - Controle do Auditório</h1>
            <p>Selecione a questão para disparar nos celulares dos alunos e veja os resultados em tempo real.</p>
        </header>

        <div class="card" style="text-align: center;">
            <div class="botoes-topo">
                <button class="btn btn-danger" onclick="encerrarVotacao()">🛑 Encerrar Votação Atual</button>
                <button class="btn btn-warning" onclick="zerarHistoricoVotos()">🧹 Limpar Todo o Histórico de Votos no Firebase</button>
            </div>
        </div>

        <div id="lista-questoes"></div>
    </div>

    <!-- FIREBASE REALTIME DATABASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const senha = prompt("Digite a senha do professor:");
        if (senha !== "123456") {
            alert("Senha incorreta!");
            window.location.href = "auditorio.html";
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBaAP0E4TMCmSzP_-UNOSQn3n1-lQOJWJw",
            authDomain: "questoes-para-auditorio.firebaseapp.com",
            databaseURL: "https://questoes-para-auditorio-default-rtdb.firebaseio.com",
            projectId: "questoes-para-auditorio",
            storageBucket: "questoes-para-auditorio.firebasestorage.app",
            messagingSenderId: "199541594520",
            appId: "1:199541594520:web:66f48f6848fadba8d133ed"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =========================================================================
        // BANCO DE QUESTÕES COMPLETO (20 QUESTÕES: MORFOLOGIA E SINTAXE)
        // =========================================================================
        const questoes = [
            {
                id: 1,
                pergunta: 'Assinale a alternativa em que todos os substantivos são classificados como sobrecomuns.',
                tipo: "A-E",
                opcoes: [
                    "A) TESTEMUNHA, VÍTIMA, CÔNJUGE",
                    "B) AGENTE, TESTEMUNHA, INDIVÍDUO",
                    "C) VÍTIMA, ESTUDANTE, CADÁVER",
                    "D) CÔNJUGE, GERENTE, MEMBRO",
                    "E) RÉU, TESTEMUNHA, PERITO",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) TESTEMUNHA, VÍTIMA, CÔNJUGE"
            },
            {
                id: 2,
                pergunta: 'Considerando a estrutura sintática das orações abaixo, assinale a opção em que o sujeito classifica-se como indeterminado.',
                tipo: "A-E",
                opcoes: [
                    "A) Havia fortes indícios de adulteração nos documentos apreendidos.",
                    "B) Faltaram recursos materiais para a conclusão da perícia técnica.",
                    "C) Divulgaram-se os resultados preliminares do exame balístico ontem.",
                    "D) Fazia muitos meses que a corporação aguardava o novo efetivo.",
                    "E) Desconfia-se de envolvimento de agentes públicos no esquema ilícito.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) Desconfia-se de envolvimento de agentes públicos no esquema ilícito."
            },
            {
                id: 3,
                pergunta: 'Assinale a alternativa em que a expressão destacada exerce a função sintática de aposto especificativo.',
                tipo: "A-E",
                opcoes: [
                    "A) A leitura DO LAUDO esclareceu a causa da morte.",
                    "B) O crime DE CONCUSSÃO prevê pena de reclusão.",
                    "C) A viatura DA POLÍCIA MILITAR bloqueou a rodovia.",
                    "D) A recusa DO DEPOENTE atrasou o encerramento do ato.",
                    "E) O combate AO TRÁFICO exige inteligência policial.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) O crime DE CONCUSSÃO prevê pena de reclusão."
            },
            {
                id: 4,
                pergunta: 'No período "Quando a equipe tática ingressou no galpão, o suspeito já HAVIA DEIXADO o local pelos fundos", a locução verbal destacada pode ser substituída, sem prejuízo do sentido original e da correção gramatical, pela forma simples:',
                tipo: "A-E",
                opcoes: [
                    "A) deixava.",
                    "B) deixaria.",
                    "C) deixara.",
                    "D) deixasse.",
                    "E) deixará.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) deixara."
            },
            {
                id: 5,
                pergunta: 'Assinale a alternativa em que o termo destacado exerce a função sintática de complemento nominal.',
                tipo: "A-E",
                opcoes: [
                    "A) O delegado desconfiou DA VERSÃO apresentada pelo suspeito.",
                    "B) A perícia necessita DE NOVOS EQUIPAMENTOS laboratoriais.",
                    "C) O escrivão entregou o relatório AO PROMOTOR de justiça.",
                    "D) A conduta do agente foi contrária ÀS NORMAS internas da instituição.",
                    "E) O batalhão obedeceu ÀS DETERMINAÇÕES do comando-geral.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) A conduta do agente foi contrária ÀS NORMAS internas da instituição."
            },
            {
                id: 6,
                pergunta: 'Assinale a opção em que a palavra destacada pertence à classe dos advérbios, permanecendo, portanto, invariável.',
                tipo: "A-E",
                opcoes: [
                    "A) O equipamento de interceptação telefônica custou CARO aos cofres públicos.",
                    "B) Os peritos apresentaram BASTANTES evidências no inquérito policial.",
                    "C) A testemunha relatou MEIA verdade durante o primeiro depoimento.",
                    "D) Os policiais realizaram LONGAS rondas na região periférica.",
                    "E) NENHUM vestígio biológico foi encontrado no interior do veículo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) O equipamento de interceptação telefônica custou CARO aos cofres públicos."
            },
            {
                id: 7,
                pergunta: 'Assinale a alternativa cuja oração apresenta predicado verbo-nominal.',
                tipo: "A-E",
                opcoes: [
                    "A) Os investigadores permaneceram atentos durante toda a madrugada.",
                    "B) O perito criminal analisou minuciosamente as impressões digitais.",
                    "C) A viatura descaracterizada estava estacionada na esquina da avenida.",
                    "D) O escrivão encaminhou os autos do processo ao Ministério Público.",
                    "E) O júri popular considerou o réu culpado pelo crime de homicídio.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) O júri popular considerou o réu culpado pelo crime de homicídio."
            },
            {
                id: 8,
                pergunta: 'No trecho "A apreensão DE ENTORPECENTES realizada pela equipe DE INVESTIGADORES interrompeu o fluxo do tráfico local", as expressões destacadas classificam-se sintaticamente, respectivamente, como:',
                tipo: "A-E",
                opcoes: [
                    "A) adjunto adnominal e complemento nominal.",
                    "B) complemento nominal e complemento nominal.",
                    "C) adjunto adnominal e adjunto adnominal.",
                    "D) complemento nominal e adjunto adnominal.",
                    "E) objeto indireto e adjunto adnominal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) complemento nominal e adjunto adnominal."
            },
            {
                id: 9,
                pergunta: 'Assinale a alternativa em que a mudança de gênero do substantivo destacado NÃO altera o seu significado, indicando apenas oposição de sexo ou flexão regular.',
                tipo: "A-E",
                opcoes: [
                    "A) O CABEÇA da organização criminosa foi capturado pela polícia.",
                    "B) O GUARDA notificou o condutor pela infração de trânsito.",
                    "C) O POLICIAL apresentou o relatório circunstanciado ao delegado.",
                    "D) O CAPITAL apreendido na operação pertencia à quadrilha.",
                    "E) O MORAL da tropa elevou-se após o sucesso da missão.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) O POLICIAL apresentou o relatório circunstanciado ao delegado."
            },
            {
                id: 10,
                pergunta: 'No período "Durante a cerimônia de formatura, o comandante-geral elogiou A TODOS os novos soldados pela disciplina", o termo em destaque exerce a função sintática de:',
                tipo: "A-E",
                opcoes: [
                    "A) objeto indireto, pois o verbo elogiar exige a preposição a em sua regência padrão.",
                    "B) objeto direto preposicionado, já que o verbo elogiar é transitivo direto e a preposição tem valor estilístico.",
                    "C) complemento nominal, visto que completa o sentido transitivo da forma verbal elogiou.",
                    "D) sujeito preposicionado, uma vez que pratica a ação expressa no contexto da oração.",
                    "E) adjunto adverbial de companhia, indicando com quem o comandante interagiu na solenidade.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) objeto direto preposicionado, já que o verbo elogiar é transitivo direto e a preposição tem valor estilístico."
            },
            {
                id: 11,
                pergunta: 'Na oração "O estabelecimento comercial permaneceu fechado POR MEDO de novos assaltos na região", a expressão em destaque classifica-se como adjunto adverbial de:',
                tipo: "A-E",
                opcoes: [
                    "A) causa.",
                    "B) finalidade.",
                    "C) concessão.",
                    "D) consequência.",
                    "E) modo.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) causa."
            },
            {
                id: 12,
                pergunta: 'No período "Os peritos criminais isolaram o perímetro do acidente e, logo em seguida, RECOLHERAM todos os fragmentos metálicos", o sujeito da segunda oração classifica-se como:',
                tipo: "A-E",
                opcoes: [
                    "A) indeterminado, pois o verbo encontra-se flexionado na terceira pessoa do plural.",
                    "B) inexistente, já que a ação verbal recai diretamente sobre o objeto direto fragmentos.",
                    "C) composto, por apresentar dois núcleos distintos ligados pela conjunção aditiva e.",
                    "D) simples, tendo como núcleo o substantivo fragmentos posposto ao verbo.",
                    "E) oculto (ou elíptico), uma vez que seu referente está expresso na oração anterior.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) oculto (ou elíptico), uma vez que seu referente está expresso na oração anterior."
            },
            {
                id: 13,
                pergunta: 'Assinale a alternativa em que a forma verbal destacada está flexionada no pretérito imperfeito do subjuntivo, expressando hipótese ou condição.',
                tipo: "A-E",
                opcoes: [
                    "A) Se o perito ENCONTRAR novos vestígios, o laudo será complementado.",
                    "B) Quando o delegado CHEGAR à delegacia, iniciaremos a oitiva.",
                    "C) Caso a testemunha COMPARECESSE à audiência, o juiz ouviria seu relato.",
                    "D) Embora o réu NEGUE a autoria, as provas materiais são contundentes.",
                    "E) Os investigadores SABIAM que o suspeito deixaria a cidade à noite.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) Caso a testemunha COMPARECESSE à audiência, o juiz ouviria seu relato."
            },
            {
                id: 14,
                pergunta: 'Assinale a opção em que o termo em destaque exerce a função sintática de agente da passiva.',
                tipo: "A-E",
                opcoes: [
                    "A) O cofre do banco foi arrombado COM UM MAÇARICO INDUSTRIAL.",
                    "B) O inquérito policial foi instaurado POR DETERMINAÇÃO JUDICIAL.",
                    "C) O suspeito foi conduzido à delegacia EM UMA VIATURA DESCARACTERIZADA.",
                    "D) A área do crime foi imediatamente isolada PELOS PRIMEIROS SOCORRISTAS.",
                    "E) Os documentos sigilosos foram arquivados POR PRECAUÇÃO.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) A área do crime foi imediatamente isolada PELOS PRIMEIROS SOCORRISTAS."
            },
            {
                id: 15,
                pergunta: 'No trecho "QUIÇÁ as imagens das câmeras de segurança revelem a identidade do autor do delito", o advérbio destacado exprime circunstância de:',
                tipo: "A-E",
                opcoes: [
                    "A) afirmação.",
                    "B) intensidade.",
                    "C) modo.",
                    "D) tempo.",
                    "E) dúvida.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "E) dúvida."
            },
            {
                id: 16,
                pergunta: 'Considerando a predicação verbal e a estrutura do predicado, assinale a opção em que o período apresenta predicado nominal.',
                tipo: "A-E",
                opcoes: [
                    "A) Os agentes retornaram exaustos da diligência na zona rural.",
                    "B) O delegado andava preocupado com o desfecho daquele inquérito.",
                    "C) O suspeito virou a mesa da sala durante o interrogatório.",
                    "D) O perito andava apressado pelos corredores do instituto médico-legal.",
                    "E) A testemunha caiu desacordada após ouvir a leitura da sentença.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) O delegado andava preocupado com o desfecho daquele inquérito."
            },
            {
                id: 17,
                pergunta: 'Assinale a alternativa em que a palavra destacada funciona morfologicamente como substantivo.',
                tipo: "A-E",
                opcoes: [
                    "A) O interrogatório durou MAIS de quatro horas ininterruptas.",
                    "B) Os policiais agiram CONFORME as determinações do comando.",
                    "C) O PORQUÊ da recusa do depoente não foi esclarecido nos autos.",
                    "D) A viatura seguiu PELA rodovia estadual em alta velocidade.",
                    "E) NENHUM documento falso foi localizado no escritório do réu.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "C) O PORQUÊ da recusa do depoente não foi esclarecido nos autos."
            },
            {
                id: 18,
                pergunta: 'No período "Ainda existem muitas lacunas no relatório pericial, embora não haja dúvidas quanto à autoria do crime", os sujeitos das formas verbais EXISTEM e HAJA classificam-se, respectivamente, como:',
                tipo: "A-E",
                opcoes: [
                    "A) inexistente e inexistente.",
                    "B) simples e simples.",
                    "C) indeterminado e inexistente.",
                    "D) simples e inexistente.",
                    "E) inexistente e indeterminado.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "D) simples e inexistente."
            },
            {
                id: 19,
                pergunta: 'Na oração "A empresa terceirizada pagou AOS PERITOS os honorários referentes ao laudo técnico", os termos AOS PERITOS e OS HONORÁRIOS exercem, respectivamente, as funções sintáticas de:',
                tipo: "A-E",
                opcoes: [
                    "A) objeto direto e objeto indireto.",
                    "B) objeto indireto e objeto direto.",
                    "C) complemento nominal e objeto direto.",
                    "D) objeto indireto e complemento nominal.",
                    "E) adjunto adverbial e objeto direto.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "B) objeto indireto e objeto direto."
            },
            {
                id: 20,
                pergunta: 'No período "ONTEM À NOITE, o delegado CARLOS ALBERTO vistoriou a viatura DA POLÍCIA CIVIL", as expressões destacadas exercem, respectivamente, as funções sintáticas de:',
                tipo: "A-E",
                opcoes: [
                    "A) adjunto adverbial, aposto especificativo e adjunto adnominal.",
                    "B) adjunto adnominal, vocativo e complemento nominal.",
                    "C) adjunto adverbial, adjunto adnominal e complemento nominal.",
                    "D) complemento nominal, aposto especificativo e adjunto adnominal.",
                    "E) adjunto adverbial, aposto explicativo e adjunto adnominal.",
                    "🤷🏽‍♂️ Chutei (não tenho certeza.)"
                ],
                gabarito: "A) adjunto adverbial, aposto especificativo e adjunto adnominal."
            }
        ];

        const container = document.getElementById("lista-questoes");

        function normalizarTexto(txt) {
            if (!txt) return "";
            return txt.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
        }

        function renderizarQuestoes() {
            container.innerHTML = "";
            questoes.forEach((q) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-header">
                        <span class="card-title">Questão ${q.id} (${q.tipo})</span>
                        <button class="btn btn-success" onclick="ativarQuestao(${q.id})">▶️ Lançar para os Alunos</button>
                    </div>
                    <p style="margin-bottom: 15px; color: #f1f5f9;"><b>${q.pergunta}</b></p>
                    <p style="font-size: 0.85rem; color: #4ade80; margin-bottom: 15px;">Gabarito: 🟢 ${q.gabarito}</p>
                    
                    <div id="resultados-q${q.id}"></div>
                    <div class="estatisticas-gerais" id="total-q${q.id}">Total de Respostas: 0</div>
                `;
                container.appendChild(card);
                ouvirVotos(q);
            });
        }

        window.ativarQuestao = function(id) {
            const q = questoes.find(item => item.id === id);
            set(ref(db, "sessao/questaoAtiva"), { ...q, ativa: true });
            alert(`Questão ${id} enviada com sucesso para a tela dos alunos!`);
        };

        window.encerrarVotacao = function() {
            set(ref(db, "sessao/questaoAtiva"), { ativa: false });
            alert("Votação encerrada! A tela dos alunos voltou ao estado padrão.");
        };

        window.zerarHistoricoVotos = function() {
            if (confirm("Tem certeza que deseja apagar TODOS os votos de testes armazenados no banco de dados?")) {
                remove(ref(db, "votos")).then(() => {
                    alert("Histórico de votos limpo com sucesso! Agora os testes começarão 100% do zero.");
                });
            }
        };

        function ouvirVotos(questao) {
            const votosRef = ref(db, `votos/${questao.id}`);
            onValue(votosRef, (snapshot) => {
                const votos = snapshot.val() || {};
                const totalVotos = Object.keys(votos).length;
                
                let contagem = {};
                questao.opcoes.forEach(op => contagem[op] = 0);

                Object.values(votos).forEach(v => {
                    if (v && v.opcao) {
                        const opcaoLimpaAluno = normalizarTexto(v.opcao);
                        
                        const chaveEncontrada = questao.opcoes.find(op => 
                            normalizarTexto(op) === opcaoLimpaAluno
                        );

                        if (chaveEncontrada) {
                            contagem[chaveEncontrada]++;
                        }
                    }
                });

                const resDiv = document.getElementById(`resultados-q${questao.id}`);
                const totalDiv = document.getElementById(`total-q${questao.id}`);
                
                if (resDiv) {
                    resDiv.innerHTML = "";
                    questao.opcoes.forEach(op => {
                        const qtd = contagem[op];
                        const pct = totalVotos > 0 ? ((qtd / totalVotos) * 100).toFixed(1) : 0;
                        const ehGabarito = normalizarTexto(op) === normalizarTexto(questao.gabarito);
                        const ehChute = normalizarTexto(op).includes("chutei");
                        
                        let corBarra = "#2563eb";
                        if (ehGabarito) corBarra = "#16a34a";
                        else if (ehChute) corBarra = "#d97706";

                        const prefixo = ehGabarito ? '🟢 ' : '';

                        resDiv.innerHTML += `
                            <div style="font-size: 0.9rem; margin-top: 5px; ${ehGabarito ? 'font-weight: bold; color: #4ade80;' : ''}">
                                ${prefixo}${op}
                            </div>
                            <div class="barra-progresso-bg">
                                <div class="barra-progresso-fill" style="width: ${pct}%; background-color: ${corBarra};"></div>
                                <div class="barra-texto">${pct}% (${qtd} votos)</div>
                            </div>
                        `;
                    });
                }

                if (totalDiv) {
                    totalDiv.innerText = `Total de Respostas: ${totalVotos}`;
                }
            });
        }

        renderizarQuestoes();
    </script>
</body>
</html>
